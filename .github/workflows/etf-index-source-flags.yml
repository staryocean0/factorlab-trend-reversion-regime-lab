name: etf-index-source-flags
on:
  push:
    branches: [research/etf-index-measurability-v1]
    paths: ['.github/workflows/etf-index-source-flags.yml']
permissions:
  contents: write
jobs:
  source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pyproject.toml
            /src/
            /shared/
            /research/etf_index_measurability/
            /tests/test_etf_index_measurability.py
            /docs/governance/ETF_INDEX_MEASURABILITY_FREEZE@1.0.json
            /docs/ops/evidence/r1a_carrier_source_audit_20260912/source_delivery_audit.json
            /docs/ops/evidence/etf_index_measurability_20260912/
            /data/manifest.json
            /data/r1a_carrier_prices/cloud_pack_v1/
            /data/market/1m/000852.SH/202[1-5].parquet
            /data/market/1m/000688.SH/202[1-5].parquet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m pytest -q tests/test_etf_index_measurability.py
      - name: Inspect provenance fields and unmatched labels
        run: python research/etf_index_measurability/source_flags.py --output docs/ops/evidence/etf_index_measurability_source_20260912
      - name: Persist separate source supplement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/etf_index_measurability_source_20260912
          git commit -m 'audit: retain source flags and missing-label provenance without revised measurements [skip ci]'
          git push origin HEAD:research/etf-index-measurability-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-measurement-source-${{ github.run_id }}
          path: |
            docs/ops/evidence/etf_index_measurability_20260912
            docs/ops/evidence/etf_index_measurability_source_20260912
