name: r1a-public-delivery-audit
on:
  workflow_dispatch:
  push:
    branches: [audit/r1a-local-delivery-b656b4b]
    paths:
      - '.github/workflows/r1a-public-delivery-audit.yml'
permissions:
  contents: write
jobs:
  public-ledger-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research/r1a_carrier_transport
            tests/test_r1a_carrier_transport.py
            tests/test_r1a_public_delivery_audit.py
            docs/governance
            docs/ops/evidence/r1_incremental_alpha_20260911
            docs/ops/evidence/r1a_carrier_transport_20260912
            docs/ops/evidence/r1a_carrier_transport_20260912_local
            data/manifest.json
            data/market/1m/000688.SH
            data/r1a_carrier_prices
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Test carrier and public-ledger boundaries
        run: PYTHONPATH=src:. python -m pytest -q tests/test_r1a_carrier_transport.py tests/test_r1a_public_delivery_audit.py
      - name: Audit hashes, summaries, pairs and original index comparators
        run: PYTHONPATH=src:. python research/r1a_carrier_transport/audit_public_delivery.py
      - name: Commit new audit receipt without overwriting local evidence
        env:
          AUDIT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/r1a_carrier_cloud_audit_20260912
          git commit -m 'audit: record ETF public-ledger reconciliation and raw-data boundary [skip ci]'
          git push origin "HEAD:$AUDIT_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-public-ledger-audit-${{ github.run_id }}
          path: docs/ops/evidence/r1a_carrier_cloud_audit_20260912
          if-no-files-found: warn
