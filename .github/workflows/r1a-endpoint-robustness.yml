name: r1a-endpoint-robustness
on:
  workflow_dispatch:
  push:
    branches: [research/r1a-endpoint-robustness-v1]
    paths: ['.github/workflows/r1a-endpoint-robustness.yml']
permissions:
  contents: write
concurrency:
  group: r1a-endpoint-robustness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research/r1a_endpoint_robustness
            research/r1a_carrier_transport
            tests/test_r1a_endpoint_robustness.py
            tests/test_r1a_endpoint_diagnostic.py
            tests/test_r1a_carrier_transport.py
            docs/governance
            docs/ops/evidence/r1_incremental_alpha_20260911/matched_pairs.csv
            docs/ops/evidence/r1a_endpoint_diagnostic_20260912
            docs/ops/evidence/r1a_endpoint_robustness_20260912
            data/manifest.json
            data/market/1m
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research package
        run: python -m pip install -e .
      - name: Synthetic dependence and selection boundary tests
        run: PYTHONPATH=src:. python -m pytest -q tests/test_r1a_endpoint_robustness.py tests/test_r1a_endpoint_diagnostic.py tests/test_r1a_carrier_transport.py
      - name: Execute frozen retrospective robustness
        run: PYTHONPATH=src:. python research/r1a_endpoint_robustness/study.py
      - name: Commit new evidence without modifying prior outcomes
        if: github.ref == 'refs/heads/research/r1a-endpoint-robustness-v1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/r1a_endpoint_robustness_20260912
          if git diff --cached --quiet; then exit 1; fi
          git commit -m 'research: record fixed R1_A dependence and selection robustness [skip ci]'
          git push origin HEAD:research/r1a-endpoint-robustness-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-endpoint-robustness-${{ github.run_id }}
          path: docs/ops/evidence/r1a_endpoint_robustness_20260912
          if-no-files-found: warn
