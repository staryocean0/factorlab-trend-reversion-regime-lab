name: r1a-cloud-raw-replay

on:
  push:
    branches: [audit/r1a-cloud-pack-9abe704]
    paths:
      - '.github/workflows/r1a-cloud-raw-replay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r1a-raw-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-csv-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research/r1a_carrier_transport
            tests/test_r1a*.py
            docs/governance/R1A_CARRIER_PRICE_TRANSPORT_FREEZE@1.0.json
            docs/ops/evidence/r1_incremental_alpha_20260911
            docs/ops/evidence/r1a_carrier_transport_20260912
            docs/ops/evidence/r1a_carrier_transport_20260912_local
            docs/ops/evidence/r1a_carrier_cloud_audit_20260912
            docs/ops/evidence/r1a_carrier_source_audit_20260912
            data/manifest.json
            data/market/1m
            data/r1a_carrier_prices
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research package
        run: python -m pip install -e .
      - name: Carrier, delivery, ledger and raw-replay boundary tests
        run: PYTHONPATH=src:. python -m pytest -q tests/test_r1a*.py
      - name: Verify public bytes and reproduce without private data
        run: |
          test ! -e data/r1a_carrier_prices/private
          PYTHONPATH=src:. python research/r1a_carrier_transport/verify_cloud_replay.py --output docs/ops/evidence/r1a_cloud_raw_replay_9abe704
      - name: Persist independently reproduced evidence
        if: github.ref == 'refs/heads/audit/r1a-cloud-pack-9abe704'
        env:
          RESEARCH_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/r1a_cloud_raw_replay_9abe704
          git diff --cached --quiet && { echo 'Missing fresh audit evidence'; exit 1; }
          git commit -m 'audit: accept actual ETF cloud bytes and reconcile original frozen replay [skip ci]'
          git push origin "HEAD:$RESEARCH_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-raw-replay-${{ github.run_id }}
          path: docs/ops/evidence/r1a_cloud_raw_replay_9abe704
          if-no-files-found: error
