name: kline-recognizer-persistence-prior-v13-once

on:
  push:
    branches:
      - research/kline-recognizer-persistence-prior-v13
    paths:
      - .github/workflows/kline-recognizer-persistence-prior-v13.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/kline-recognizer-persistence-prior-v13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Validate immutable market package
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pyarrow.parquet as pq
          root = Path('.').resolve()
          manifest = json.loads((root / 'data/manifest.json').read_text())
          for item in manifest['files']:
              path = root / item['path']
              with path.open('rb') as handle:
                  assert hashlib.file_digest(handle, 'sha256').hexdigest() == item['sha256']
              pf = pq.ParquetFile(path)
              assert pf.metadata.num_rows == item['rows']
              frame = pf.read(columns=['symbol','trading_day']).to_pandas()
              assert set(frame['symbol']) == {item['symbol']}
              assert frame['trading_day'].min() == item['first_day']
              assert frame['trading_day'].max() == item['last_day']
              assert item['last_day'] <= '2025-12-31'
          print(json.dumps({'status':'passed','partitions':len(manifest['files'])}))
          PY
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run frozen v13 persistence prior
        run: python scripts/run_kline_persistence_prior_v13.py --code-commit "$(git rev-parse HEAD)"
      - name: Commit immutable v13 result bundle
        run: |
          git config user.name "factorlab-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/kline_recognizer_persistence_prior_v13
          git commit -m "[skip ci] record K-line persistence prior v13 results" || exit 0
          git push origin HEAD:research/kline-recognizer-persistence-prior-v13
