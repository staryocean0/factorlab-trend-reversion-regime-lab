name: etf-index-measurability-regression
on:
  workflow_dispatch:
  push:
    branches: [main, research/etf-index-measurability-v1, audit/etf-source-repair-impact-v1]
    paths:
      - 'research/etf_index_measurability/**'
      - 'research/etf_source_repair/verify_legacy_inventory.py'
      - 'tests/test_etf*.py'
      - 'docs/governance/ETF_*'
      - 'docs/ops/evidence/etf_index_measurability*/**'
      - '.github/workflows/etf-index-measurability.yml'
permissions:
  contents: read
concurrency:
  group: etf-readonly-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  readonly-measurement-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pyproject.toml
            /src/
            /shared/
            /research/etf_index_measurability/
            /research/etf_source_repair/verify_legacy_inventory.py
            /tests/test_etf_index_measurability.py
            /tests/test_etf_measurement_retained.py
            /tests/test_etf_measurement_replay_precision.py
            /tests/test_etf_replay_inventory.py
            /docs/governance/ETF_INDEX_MEASURABILITY_FREEZE@1.0.json
            /docs/governance/ETF_SOURCE_QUALITY_ADVISORY_20260912.json
            /docs/governance/R1A_PRICE_RESEARCH_DISPOSITION_20260912.json
            /docs/ops/evidence/r1a_carrier_source_audit_20260912/source_delivery_audit.json
            /docs/ops/evidence/etf_index_measurability_20260912/
            /docs/ops/evidence/etf_index_measurability_source_20260912/
            /data/manifest.json
            /data/r1a_carrier_prices/cloud_pack_v1/
            /data/market/1m/000852.SH/202[1-5].parquet
            /data/market/1m/000688.SH/202[1-5].parquet
      - name: Fetch original inventory commit without unrelated data blobs
        run: git fetch --no-tags --filter=blob:none --depth=1 origin 410a064bf73f3631cdba8a85302fc6fa32c80955
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Test observation, precision and commit-specific inventory guards
        run: python -m pytest -q tests/test_etf_index_measurability.py tests/test_etf_measurement_retained.py tests/test_etf_measurement_replay_precision.py tests/test_etf_replay_inventory.py
      - name: Verify exact source isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          actual=sorted(str(p) for p in Path('data').rglob('*.parquet'))
          assert actual==sorted(f'data/market/1m/{s}/{y}.parquet' for s in ('000852.SH','000688.SH') for y in range(2021,2026))
          assert len(list(Path('data').rglob('*.csv')))==12
          assert not Path('research/r1a_walkforward_prediction').exists()
          PY
      - name: Reproduce numerical evidence and verify both versioned inventories
        run: |
          python research/etf_index_measurability/audit.py --output "$RUNNER_TEMP/etf-measurement"
          python research/etf_source_repair/verify_legacy_inventory.py --reference docs/ops/evidence/etf_index_measurability_20260912 --replay "$RUNNER_TEMP/etf-measurement" --output "$RUNNER_TEMP/etf-measurement-replay-audit.json"
      - name: Reproduce separate source-provenance inspection
        run: |
          python research/etf_index_measurability/source_flags.py --output "$RUNNER_TEMP/etf-source"
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          old=Path('docs/ops/evidence/etf_index_measurability_source_20260912')
          new=Path(os.environ['RUNNER_TEMP'])/'etf-source'
          r=json.loads((old/'receipt.json').read_text())
          for s in r['files']:
              assert hashlib.sha256((new/s['path']).read_bytes()).hexdigest()==s['sha256']
          assert json.loads((new/'receipt.json').read_text())==r
          print('Source supplement reproduced; no strategy or source-completeness promotion.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-measurement-replay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/etf-measurement
            ${{ runner.temp }}/etf-source
            ${{ runner.temp }}/etf-measurement-replay-audit.json
