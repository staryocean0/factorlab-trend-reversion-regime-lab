name: repository-consistency
on:
  push:
    branches: [main, maintenance/repository-consistency-20260912]
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run all tests and all ten frozen historical/source workflow replays
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: repository-consistency-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consistency:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[validate-repository]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/README.md
            /data/manifest.json
            !/docs/ops/evidence/
            /docs/ops/evidence/etf_day_reconciliation_20260912/receipt.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and maintenance dependencies
        run: python -m pip install -e '.[maintenance]'
      - name: Check repository-wide component, source and workflow consistency
        run: python scripts/repository_consistency.py --check --output "$RUNNER_TEMP/repository-consistency.json"
      - name: Test maintenance guards and current M2-M8 trend contracts
        run: >-
          python -m pytest -q
          tests/test_repository_consistency.py
          tests/test_product_document_governance.py
          tests/test_post_v1_x5_closeout.py
          tests/test_post_v1_x5f_closeout.py
          tests/test_post_v1_x5g_closeout.py
          tests/test_post_v1_x5l_closeout.py
          tests/test_post_v1_x5m_closeout.py
          tests/test_trend_regime_baseline.py
          tests/test_trend_regime_profiles.py
          tests/test_five_bucket_protocol.py
          tests/test_m5_source_profile_admission.py
          tests/test_m5_development_adequacy_pipeline.py
          tests/test_m5_development_seal.py
          tests/test_m5_primary_validation_execution.py
          tests/test_m5_primary_validation_receipt.py
          tests/test_m5_t2_sensitivity_execution.py
          tests/test_m5_star50_replication_execution.py
          tests/test_m6_representation_decision.py
          tests/test_trend_regime_consumer.py
          tests/test_m7_consumer_hardening.py
          tests/test_m7_consumer_contract.py
          tests/test_m8_strategy_integration.py
          tests/test_m8_strategy_integration_contract.py
          --junitxml="$RUNNER_TEMP/maintenance-tests.xml"
      - name: Validate setup shell syntax
        run: bash -n .codex/cloud_setup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-consistency-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/repository-consistency.json
            ${{ runner.temp }}/maintenance-tests.xml
          if-no-files-found: warn

  m5-development-adequacy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[m5-development]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/manifest.json
            /data/market/1m/
            /data/market/5m/
            !/docs/ops/evidence/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and maintenance dependencies
        run: python -m pip install -e '.[maintenance]'
      - name: Compute Development-only episode sample adequacy
        run: python scripts/m5_development_adequacy.py --output "$RUNNER_TEMP/m5-development-adequacy.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-development-adequacy-${{ github.run_id }}
          path: ${{ runner.temp }}/m5-development-adequacy.json
          if-no-files-found: error

  m5-primary-validation:
    needs: consistency
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo "M5-4 primary validation consumed; rerun forbidden by TREND_M5_PRIMARY_VALIDATION_EXECUTION_V1.json"

  m5-t2-sensitivity:
    needs: consistency
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo "M5-5 T2=3/5 sensitivity consumed; rerun forbidden by TREND_M5_T2_SENSITIVITY_EXECUTION_V1.json"

  m5-star50-replication:
    needs: consistency
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo "M5-6 STAR50 replication consumed; rerun forbidden by TREND_M5_STAR50_REPLICATION_EXECUTION_V1.json"

  full-regression:
    needs: consistency
    if: inputs.full_regression == true || contains(github.event.head_commit.message, '[full-regression]')
    uses: ./.github/workflows/repository-regression.yml
  source-field-replay:
    needs: consistency
    if: inputs.full_regression == true || contains(github.event.head_commit.message, '[full-regression]')
    uses: ./.github/workflows/etf-day-reconciliation.yml
  source-observation-replay:
    needs: consistency
    if: inputs.full_regression == true || contains(github.event.head_commit.message, '[full-regression]')
    uses: ./.github/workflows/etf-one-day-observation.yml
  source-document-replay:
    needs: consistency
    if: inputs.full_regression == true || contains(github.event.head_commit.message, '[full-regression]')
    uses: ./.github/workflows/etf-upstream-delivery.yml
  no-fit-evidence-closeout:
    needs: consistency
    if: inputs.full_regression == true || contains(github.event.head_commit.message, '[full-regression]')
    uses: ./.github/workflows/r1a-evidence-closeout.yml
  known-action-impact-replay:
    needs: consistency
    if: inputs.full_regression == true || contains(github.event.head_commit.message, '[full-regression]')
    uses: ./.github/workflows/etf-source-repair.yml
  measurement-replay:
    needs: consistency
    if: inputs.full_regression == true || contains(github.event.head_commit.message, '[full-regression]')
    uses: ./.github/workflows/etf-index-measurability.yml
  development-noise-replay:
    needs: consistency
    if: inputs.full_regression == true || contains(github.event.head_commit.message, '[full-regression]')
    uses: ./.github/workflows/r1a-development-noise-regression.yml
  closed-design-replay:
    needs: consistency
    if: inputs.full_regression == true || contains(github.event.head_commit.message, '[full-regression]')
    uses: ./.github/workflows/r1a-control-design.yml
  frozen-prediction-replay:
    needs: consistency
    if: inputs.full_regression == true || contains(github.event.head_commit.message, '[full-regression]')
    uses: ./.github/workflows/r1a-walkforward-prediction.yml
  legacy-price-statistics-replay:
    needs: consistency
    if: inputs.full_regression == true || contains(github.event.head_commit.message, '[full-regression]')
    uses: ./.github/workflows/legacy-price-statistics-replay.yml
