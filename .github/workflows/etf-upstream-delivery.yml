name: etf-upstream-delivery-audit
on:
  workflow_dispatch:
  push:
    branches: [audit/etf-upstream-delivery-v1]
    paths:
      - '.github/workflows/etf-upstream-delivery.yml'
permissions:
  contents: write
jobs:
  upstream-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/etf_upstream_evidence_v1/
            /research/etf_upstream_review/
            /tests/test_etf_upstream_review.py
            /docs/ops/evidence/etf_upstream_cloud_review_20260912/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests including synthetic actual-source-function boundaries
        run: python -m unittest discover -s tests -p test_etf_upstream_review.py -v
      - name: Run fixed-file lineage and time-channel audit without strategy outcomes
        run: python research/etf_upstream_review/audit.py --output docs/ops/evidence/etf_upstream_cloud_review_20260912
      - name: Retain new evidence only on the audit branch
        if: github.ref == 'refs/heads/audit/etf-upstream-delivery-v1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/etf_upstream_cloud_review_20260912
          git commit -m 'audit: retain upstream source review without promoting market evidence [skip ci]'
          git push origin HEAD:audit/etf-upstream-delivery-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-upstream-review-${{ github.run_id }}
          path: docs/ops/evidence/etf_upstream_cloud_review_20260912/
          if-no-files-found: error
