name: r1-incremental-alpha-attribution

on:
  workflow_dispatch:
  push:
    branches: [research/r1-incremental-alpha-attribution-v1]
    paths:
      - '.github/workflows/r1-incremental-alpha-attribution.yml'

permissions:
  contents: write

jobs:
  frozen-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r1-incremental-alpha-attribution-v1
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research/index_price_validity
            research/r1_incremental_alpha_attribution
            tests/test_r1_incremental_alpha_attribution.py
            docs/governance/INDEX_PRICE_VALIDITY_FREEZE@1.0.json
            docs/governance/R1_INCREMENTAL_ALPHA_ATTRIBUTION_FREEZE@1.0.json
            docs/research
            docs/ops/evidence
            data/manifest.json
            data/market/1m
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run frozen attribution tests
        run: PYTHONPATH=src:. python -m pytest -q tests/test_r1_incremental_alpha_attribution.py
      - name: Execute frozen matched-parent attribution
        run: PYTHONPATH=src:. python research/r1_incremental_alpha_attribution/run_study.py
      - name: Commit decisive attribution evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/r1_incremental_alpha_20260911 docs/research/R1_INCREMENTAL_ALPHA_ATTRIBUTION_20260911.md
          if git diff --cached --quiet; then
            echo 'No attribution evidence produced'
            exit 1
          fi
          git commit -m 'research: record frozen R1 incremental-alpha attribution [skip ci]'
          git push origin HEAD:research/r1-incremental-alpha-attribution-v1
