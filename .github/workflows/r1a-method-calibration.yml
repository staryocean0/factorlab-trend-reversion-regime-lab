name: r1a-method-calibration

on:
  workflow_dispatch:
  push:
    branches: [research/r1a-method-calibration-v1]
    paths:
      - '.github/workflows/r1a-method-calibration.yml'

permissions:
  contents: write

concurrency:
  group: r1a-method-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-synthetic-method-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research/r1a_method_calibration
            research/r1a_confirmation_feasibility/study.py
            research/r1a_endpoint_robustness/study.py
            tests/test_r1a_method_calibration.py
            docs/governance/R1A_METHOD_CALIBRATION_FREEZE@1.0.json
            docs/ops/evidence/r1_incremental_alpha_20260911/matched_pairs.csv
            docs/ops/evidence/r1a_endpoint_diagnostic_20260912/endpoint_receipt.json
            docs/ops/evidence/r1a_endpoint_diagnostic_20260912/512100.SH_endpoint_availability.csv
            docs/ops/evidence/r1a_endpoint_diagnostic_20260912/588000.SH_endpoint_availability.csv
            docs/ops/evidence/r1a_confirmation_feasibility_20260912/planning/historical_noise_NOT_new_tests.csv
            data/manifest.json
            data/market/1m/000852.SH/2021.parquet
            data/market/1m/000852.SH/2022.parquet
            data/market/1m/000852.SH/2023.parquet
            data/market/1m/000852.SH/2024.parquet
            data/market/1m/000852.SH/2025.parquet
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research package
        run: python -m pip install -e .
      - name: Test mathematical and source-access boundaries
        run: python -m pytest -q tests/test_r1a_method_calibration.py
      - name: Enforce no real ETF outcomes or new candidate data in checkout
        run: |
          test ! -e docs/ops/evidence/r1a_endpoint_diagnostic_20260912/512100.SH_endpoint_returns.csv
          test ! -e docs/ops/evidence/r1a_endpoint_diagnostic_20260912/588000.SH_endpoint_returns.csv
          test ! -d data/r1a_carrier_prices
          test ! -d data/gap_fill_repeat_2026
      - name: Execute frozen synthetic methods and joint family calibration
        run: python research/r1a_method_calibration/study.py --output docs/ops/evidence/r1a_method_calibration_20260912
      - name: Preserve public synthetic receipts without changing old evidence
        if: github.ref == 'refs/heads/research/r1a-method-calibration-v1'
        env:
          RESEARCH_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/r1a_method_calibration_20260912
          if ! git diff --cached --quiet; then
            git commit -m 'research: record bounded synthetic method calibration and information limits [skip ci]'
            git push origin "HEAD:$RESEARCH_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-method-calibration-${{ github.run_id }}
          path: docs/ops/evidence/r1a_method_calibration_20260912
          if-no-files-found: warn
