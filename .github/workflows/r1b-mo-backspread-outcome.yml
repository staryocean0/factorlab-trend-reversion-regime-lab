name: r1b-mo-backspread-outcome

on:
  workflow_dispatch:
  push:
    branches: [research/r1b-mo-backspread-v1]
    paths:
      - '.github/workflows/r1b-mo-backspread-outcome.yml'

permissions:
  contents: write

jobs:
  frozen-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/r1b-mo-backspread-v1
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research
            tests/test_r1b_mo_backspread.py
            docs/governance/R1B_MO_BACKSPREAD_PRE_EXECUTION_FREEZE@1.0.json
            docs/research/R1B_MO_RATIO_BACKSPREAD_THEORY_FREEZE_20260911.md
            data/r1b_research
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Re-run frozen preflight
        run: PYTHONPATH=src:. python -m pytest -q tests/test_r1b_mo_backspread.py
      - name: Execute frozen historical outcome
        run: PYTHONPATH=src:. python research/r1b_mo_backspread/run_study.py
      - name: Commit decisive evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ops/evidence/r1b_mo_backspread_20260911 docs/research/R1B_MO_RATIO_BACKSPREAD_OUTCOME_STUDY_20260911.md
          if git diff --cached --quiet; then
            echo 'No outcome evidence produced'
            exit 1
          fi
          git commit -m 'research: record frozen R1B MO backspread outcome [skip ci]'
          git push origin HEAD:research/r1b-mo-backspread-v1
