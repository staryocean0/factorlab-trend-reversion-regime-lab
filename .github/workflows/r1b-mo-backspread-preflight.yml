name: r1b-mo-backspread-preflight

on:
  workflow_dispatch:
  push:
    branches: [research/r1b-mo-backspread-v1]
    paths:
      - 'research/r1b_mo_backspread/**'
      - 'tests/test_r1b_mo_backspread.py'
      - 'docs/governance/R1B_MO_BACKSPREAD_PRE_EXECUTION_FREEZE@1.0.json'
      - '.github/workflows/r1b-mo-backspread-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research
            tests/test_r1b_mo_backspread.py
            docs/governance/R1B_MO_BACKSPREAD_PRE_EXECUTION_FREEZE@1.0.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run frozen backspread tests only
        run: PYTHONPATH=src:. python -m pytest -q tests/test_r1b_mo_backspread.py
