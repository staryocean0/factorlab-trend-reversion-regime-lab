name: kline-state-recognition-v1-once

on:
  push:
    branches:
      - research/kline-state-recognition-v1
    paths:
      - .github/workflows/kline-state-recognition-v1.yml

permissions:
  contents: write

jobs:
  recognize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/kline-state-recognition-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Validate seed
        run: python scripts/validate_seed.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run frozen recognition exam
        run: python scripts/run_kline_state_recognition_v1.py --code-commit "$(git rev-parse HEAD)"
      - name: Commit immutable result bundle
        run: |
          git config user.name "factorlab-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/kline_state_recognition_v1
          git commit -m "[skip ci] record K-line state recognition v1 results" || exit 0
          git push origin HEAD:research/kline-state-recognition-v1
