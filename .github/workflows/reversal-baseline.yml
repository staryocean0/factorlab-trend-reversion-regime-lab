name: reversal-research

on:
  push:
    branches:
      - research/phase0-regime-protocol
    paths:
      - '.github/workflows/reversal-baseline.yml'
      - 'src/regime_lab/reversal_mean_reversion.py'
      - 'src/regime_lab/reversal_confirmations.py'
      - 'src/regime_lab/robust_mean_reversion.py'
      - 'tests/test_reversal_mean_reversion.py'
      - 'tests/test_reversal_confirmations.py'
      - 'tests/test_robust_mean_reversion.py'
      - 'scripts/run_reversal_baseline.py'
      - 'scripts/run_reversal_path_diagnostic.py'
      - 'scripts/run_reversal_confirmation_v0_3.py'
      - 'scripts/run_reversal_structure_v0_4.py'
      - 'scripts/run_robust_mean_reversion_v0_5.py'
      - 'src/regime_lab/market_data.py'
      - 'data/market/5m/**'
      - 'data/manifest.json'

permissions:
  contents: read

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Validate sealed seed files remain unchanged on research branch
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from regime_lab.package_guard import public_files

          root = Path('.').resolve()
          public_files(root)
          manifest = json.loads((root / 'docs/seed_manifest.json').read_text())
          missing = []
          mismatched = []
          for row in manifest['files']:
              path = root / row['path']
              if not path.exists():
                  missing.append(row['path'])
                  continue
              with path.open('rb') as handle:
                  actual = hashlib.file_digest(handle, 'sha256').hexdigest()
              if actual != row['sha256']:
                  mismatched.append(row['path'])
          assert not missing, f'missing sealed seed files: {missing}'
          assert not mismatched, f'modified sealed seed files: {mismatched}'
          print({'status': 'passed', 'sealed_seed_files': len(manifest['files']), 'research_extensions_allowed': True})
          PY
      - name: Validate original seed snapshot with original exact-set validator
        run: |
          git fetch --depth=1 origin main
          git worktree add /tmp/seed-main FETCH_HEAD
          (cd /tmp/seed-main && python scripts/validate_seed.py)
      - run: python -m pytest -q
      - run: python scripts/run_reversal_baseline.py
      - run: python scripts/run_reversal_path_diagnostic.py
      - run: python scripts/run_reversal_confirmation_v0_3.py
      - run: python scripts/run_reversal_structure_v0_4.py
      - run: python scripts/run_robust_mean_reversion_v0_5.py
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-baseline-v0-1
          path: artifacts/reversal_baseline_v0_1/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-path-diagnostic-v0-2
          path: artifacts/reversal_path_diagnostic_v0_2/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-confirmation-v0-3
          path: artifacts/reversal_confirmation_v0_3/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-structure-v0-4
          path: artifacts/reversal_structure_v0_4/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: robust-mean-reversion-v0-5
          path: artifacts/robust_mean_reversion_v0_5/
          if-no-files-found: error
