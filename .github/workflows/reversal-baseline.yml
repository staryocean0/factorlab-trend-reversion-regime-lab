name: reversal-baseline-v0-1

on:
  push:
    branches:
      - research/phase0-regime-protocol
    paths:
      - '.github/workflows/reversal-baseline.yml'
      - 'src/regime_lab/reversal_mean_reversion.py'
      - 'tests/test_reversal_mean_reversion.py'
      - 'scripts/run_reversal_baseline.py'
      - 'src/regime_lab/market_data.py'
      - 'data/market/5m/**'
      - 'data/manifest.json'

permissions:
  contents: read

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/validate_seed.py
      - run: python -m pytest -q
      - run: python scripts/run_reversal_baseline.py
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-baseline-v0-1
          path: artifacts/reversal_baseline_v0_1/
          if-no-files-found: error
