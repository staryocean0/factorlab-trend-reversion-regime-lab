name: r1a-endpoint-diagnostic

on:
  push:
    branches: [research/r1a-observed-endpoint-diagnostic-v1]
    paths:
      - '.github/workflows/r1a-endpoint-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: r1a-endpoint-diagnostic-v1
  cancel-in-progress: false

jobs:
  frozen-endpoint-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research/r1a_carrier_transport
            tests/test_r1a_carrier_transport.py
            tests/test_r1a_endpoint_diagnostic.py
            docs/governance
            docs/ops/evidence/r1_incremental_alpha_20260911/matched_pairs.csv
            data/manifest.json
            data/market/1m
            data/r1a_carrier_prices/cloud_pack_v1
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Test endpoint identities, no-fill rules, and coverage gates
        run: PYTHONPATH=src:. python -m pytest -q tests/test_r1a_endpoint_diagnostic.py tests/test_r1a_carrier_transport.py
      - name: Run separately frozen endpoint diagnostic from public CSVs
        run: |
          test ! -d data/r1a_carrier_prices/private
          PYTHONPATH=src:. python research/r1a_carrier_transport/endpoint_diagnostic.py --output docs/ops/evidence/r1a_endpoint_diagnostic_20260912
          cat docs/ops/evidence/r1a_endpoint_diagnostic_20260912/REPORT.md
      - name: Preserve decisive evidence without editing v1
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/r1a_endpoint_diagnostic_20260912
          git diff --cached --quiet && exit 1
          git commit -m 'research: retain frozen observed-endpoint ETF diagnostic [skip ci]'
          git push origin "HEAD:$TARGET_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-endpoint-diagnostic-${{ github.run_id }}
          path: docs/ops/evidence/r1a_endpoint_diagnostic_20260912
          if-no-files-found: warn
