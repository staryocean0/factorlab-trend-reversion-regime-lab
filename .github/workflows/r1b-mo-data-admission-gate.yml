name: research-regression-gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/r1b_mo_data_admission/**'
      - 'research/r1b_mo_pre_execution/**'
      - 'research/r1b_mo_outcome/**'
      - 'research/r1b_mo_backspread/**'
      - 'research/index_price_validity/**'
      - 'research/r1_incremental_alpha_attribution/**'
      - 'research/r1a_carrier_transport/**'
      - 'research/r1a_endpoint_robustness/**'
      - 'research/r1a_confirmation_feasibility/**'
      - 'research/r1a_method_calibration/**'
      - 'tests/test_r1b_mo_*.py'
      - 'tests/test_index_price_validity.py'
      - 'tests/test_r1_incremental_alpha_attribution.py'
      - 'tests/test_r1a_*.py'
      - 'docs/governance/R1B_MO_*.json'
      - 'docs/governance/INDEX_PRICE_VALIDITY_FREEZE@1.0.json'
      - 'docs/governance/R1_INCREMENTAL_ALPHA_ATTRIBUTION_FREEZE@1.0.json'
      - 'docs/governance/R1A_CARRIER_PRICE_TRANSPORT_FREEZE@1.0.json'
      - 'docs/governance/R1A_ENDPOINT_PRICE_DIAGNOSTIC_FREEZE@1.0.json'
      - 'docs/governance/R1A_ENDPOINT_ROBUSTNESS_FREEZE@1.0.json'
      - 'docs/governance/R1A_CONFIRMATION_FEASIBILITY_FREEZE@1.0.json'
      - 'docs/governance/R1A_METHOD_CALIBRATION_FREEZE@1.0.json'
      - 'docs/ops/evidence/r1b_mo_outcome_20260911/**'
      - 'docs/ops/evidence/r1_incremental_alpha_20260911/**'
      - 'docs/ops/evidence/r1a_carrier_transport_20260912/**'
      - 'docs/ops/evidence/r1a_carrier_transport_20260912_local/**'
      - 'docs/ops/evidence/r1a_carrier_cloud_audit_20260912/**'
      - 'docs/ops/evidence/r1a_carrier_source_audit_20260912/**'
      - 'docs/ops/evidence/r1a_cloud_raw_replay_9abe704/**'
      - 'docs/ops/evidence/r1a_endpoint_diagnostic_20260912/**'
      - 'docs/ops/evidence/r1a_endpoint_robustness_20260912/**'
      - 'docs/ops/evidence/r1a_confirmation_feasibility_20260912/**'
      - 'docs/ops/evidence/r1a_method_calibration_20260912/**'
      - 'data/r1a_carrier_prices/**'
      - 'data/manifest.json'
      - 'data/market/1m/**'
      - 'data/r1b_research/**'
      - 'pyproject.toml'
      - '.github/workflows/r1b-mo-data-admission-gate.yml'

permissions:
  contents: read

jobs:
  research-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research
            tests
            docs/governance
            docs/ops/evidence/r1b_mo_outcome_20260911
            docs/ops/evidence/r1_incremental_alpha_20260911
            docs/ops/evidence/r1a_carrier_transport_20260912
            docs/ops/evidence/r1a_carrier_transport_20260912_local
            docs/ops/evidence/r1a_carrier_cloud_audit_20260912
            docs/ops/evidence/r1a_carrier_source_audit_20260912
            docs/ops/evidence/r1a_endpoint_diagnostic_20260912
            docs/ops/evidence/r1a_endpoint_robustness_20260912
            docs/ops/evidence/r1a_confirmation_feasibility_20260912
            docs/ops/evidence/r1a_method_calibration_20260912
            data/manifest.json
            data/market/1m
            data/r1a_carrier_prices
            data/r1b_research
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run MO, price-attribution, carrier, feasibility and method regression tests
        run: PYTHONPATH=src:. python -m pytest -q tests/test_r1b_mo_*.py tests/test_index_price_validity.py tests/test_r1_incremental_alpha_attribution.py tests/test_r1a_*.py
      - name: Reproduce original full-path ETF result from public CSV bytes
        run: PYTHONPATH=src:. python research/r1a_carrier_transport/verify_cloud_replay.py --output "$RUNNER_TEMP/r1a-public-csv-replay"
      - name: Reproduce separate endpoint diagnostic and reconcile frozen outputs
        env:
          PYTHONPATH: src:.
        run: |
          python research/r1a_carrier_transport/endpoint_diagnostic.py --output "$RUNNER_TEMP/r1a-endpoint-replay"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from research.r1a_carrier_transport.endpoint_diagnostic import sha
          from research.r1a_carrier_transport.audit_public_delivery import compare_json
          old = Path('docs/ops/evidence/r1a_endpoint_diagnostic_20260912')
          new = Path(os.environ['RUNNER_TEMP'])/'r1a-endpoint-replay'
          a = json.loads((old/'endpoint_receipt.json').read_text())
          b = json.loads((new/'endpoint_receipt.json').read_text())
          assert a['decision'] == b['decision']
          assert a['freeze_sha256'] == b['freeze_sha256']
          compare_json(b['carriers'], a['carriers'])
          for spec in a['evidence_files']:
              assert sha(new/spec['path']) == spec['sha256'], spec['path']
          print('Endpoint evidence reproduced; this is not new empirical certification.')
          PY
      - name: Reproduce retrospective robustness without choosing a new specification
        env:
          PYTHONPATH: src:.
        run: |
          python research/r1a_endpoint_robustness/study.py --output "$RUNNER_TEMP/r1a-robustness-replay"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from research.r1a_carrier_transport.audit_public_delivery import compare_json
          from research.r1a_endpoint_robustness.study import sha
          old = Path('docs/ops/evidence/r1a_endpoint_robustness_20260912')
          new = Path(os.environ['RUNNER_TEMP'])/'r1a-robustness-replay'
          a = json.loads((old/'robustness_receipt.json').read_text())
          b = json.loads((new/'robustness_receipt.json').read_text())
          assert a['freeze_sha256'] == b['freeze_sha256']
          for k in ['decision','carriers','primary_family14_positive_cells','all_four_family56_positive_cells']:
              compare_json(b[k], a[k], k)
          for spec in a['output_csvs']:
              assert sha(new/spec['path']) == spec['sha256'], spec['path']
          print('All frozen robustness values reconciled; no new significance claim.')
          PY
      - name: Reproduce fixed feasibility and null simulations, no new data-role probe
        env:
          PYTHONPATH: src:.
        run: |
          python research/r1a_confirmation_feasibility/study.py --output "$RUNNER_TEMP/r1a-feasibility-replay"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from research.r1a_endpoint_robustness.study import sha
          from research.r1a_carrier_transport.audit_public_delivery import compare_json
          old=Path('docs/ops/evidence/r1a_confirmation_feasibility_20260912/planning')
          new=Path(os.environ['RUNNER_TEMP'])/'r1a-feasibility-replay'
          a=json.loads((old/'feasibility_receipt.json').read_text())
          b=json.loads((new/'feasibility_receipt.json').read_text())
          for k in ['decision','freeze_sha256','design_count','table_rows','historical_trading_days',
                    'primary_CSI1000_short_locations_NOT_selected','four_bp_budget_comparison_NOT_forecast',
                    'calibration_summary','simulated_samples']:
              compare_json(b[k],a[k],k)
          for spec in a['files']:
              assert sha(new/spec['path'])==spec['sha256'],spec['path']
          assert b['new_confirmation_prices_read'] is False
          assert b['confirmation_protocol_frozen'] is False
          print('Conditional planning and synthetic simulations reproduced; no confirmation sample opened.')
          PY
      - name: Reproduce fixed method-only simulations and audit exact counts and numeric differences
        env:
          PYTHONPATH: src:.
        run: |
          python research/r1a_method_calibration/study.py --output "$RUNNER_TEMP/r1a-method-replay"
          python research/r1a_method_calibration/replay_audit.py \
            --reference docs/ops/evidence/r1a_method_calibration_20260912 \
            --replay "$RUNNER_TEMP/r1a-method-replay" \
            --output "$RUNNER_TEMP/r1a-method-replay-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-method-replay-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r1a-method-replay-audit.json
            ${{ runner.temp }}/r1a-method-replay
          if-no-files-found: warn
