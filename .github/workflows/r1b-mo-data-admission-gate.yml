name: r1b-mo-data-admission-gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/r1b_mo_data_admission/**'
      - 'tests/test_r1b_mo_data_admission.py'
      - 'docs/governance/R1B_MO_DATA_ADMISSION_PROTOCOL_V1.json'
      - 'docs/governance/R1B_MO_ADMISSION_MANIFEST_TEMPLATE.json'
      - '.github/workflows/r1b-mo-data-admission-gate.yml'

permissions:
  contents: read

jobs:
  admission-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run MO admission gate tests
        run: python -m pytest -q tests/test_r1b_mo_data_admission.py
