name: acquire-ciis-cffex-snapshot-sample

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acquire-ciis-cffex-snapshot-sample.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Probe CIIS live sample and archive fallback
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://www.ciis.com.hk/hongkong/en/historicaldata1/sampledata/index.shtml'
          OUT='research/r1b_mo_data_admission/source_samples/ciis_cffex_snapshot_20221206'
          mkdir -p "$OUT"
          rm -f "$OUT/20221206_Sample_CFF_Snapshot.xlsx"

          curl -k -fL --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0 FactorLabResearch/1.0' "$PAGE" -o /tmp/ciis_sample_page.html
          cp /tmp/ciis_sample_page.html "$OUT/ciis_sample_page_capture.html"

          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from pathlib import Path
          import hashlib, json, re

          page='https://www.ciis.com.hk/hongkong/en/historicaldata1/sampledata/index.shtml'
          target='20221206_Sample_CFF_Snapshot.xlsx'
          html=Path('/tmp/ciis_sample_page.html').read_text(encoding='utf-8', errors='replace')
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=='a':
                      d=dict(attrs)
                      if d.get('href'): self.hrefs.append(d['href'])
          p=P(); p.feed(html)
          matches=[h for h in p.hrefs if target.lower() in h.lower()]
          if not matches:
              matches=re.findall(r'''[^\"'<>\s]*20221206_Sample_CFF_Snapshot\.xlsx[^\"'<>\s]*''', html, flags=re.I)
          resolved=urljoin(page,matches[0]) if matches else None
          ctx=''
          pos=html.lower().find(target.lower())
          if pos>=0: ctx=html[max(0,pos-1000):pos+1500]
          Path('/tmp/ciis_snapshot_url.txt').write_text(resolved or '',encoding='utf-8')
          Path('research/r1b_mo_data_admission/source_samples/ciis_cffex_snapshot_20221206/page_link_context.txt').write_text(ctx,encoding='utf-8')
          meta={
            'source_page':page,
            'target_filename':target,
            'page_sha256':hashlib.sha256(Path('/tmp/ciis_sample_page.html').read_bytes()).hexdigest(),
            'target_listed_on_current_page':bool(matches),
            'listed_href':matches[0] if matches else None,
            'resolved_live_url':resolved,
            'source_page_tls_verified':False,
            'source_page_tls_caveat':'curl -k required because CIIS certificate chain did not validate on GitHub hosted runner'
          }
          Path('research/r1b_mo_data_admission/source_samples/ciis_cffex_snapshot_20221206/listing_receipt.json').write_text(json.dumps(meta,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(meta,indent=2))
          PY

          URL="$(cat /tmp/ciis_snapshot_url.txt)"
          LIVE_OK=0
          LIVE_STATUS='not_attempted'
          if [ -n "$URL" ]; then
            set +e
            STATUS=$(curl -k -L -A 'Mozilla/5.0 FactorLabResearch/1.0' \
              --connect-timeout 20 --max-time 120 -sS -o /tmp/ciis_live_sample.xlsx -w '%{http_code}' "$URL")
            RC=$?
            set -e
            LIVE_STATUS="curl_rc=${RC};http_status=${STATUS}"
            if [ "$RC" -eq 0 ] && [ "$STATUS" = '200' ] && [ -s /tmp/ciis_live_sample.xlsx ]; then
              cp /tmp/ciis_live_sample.xlsx "$OUT/20221206_Sample_CFF_Snapshot.xlsx"
              echo 'ciis_live' > /tmp/acquisition_route.txt
              LIVE_OK=1
            fi
          fi
          printf '%s\n' "$LIVE_STATUS" > "$OUT/live_download_status.txt"

          # Same-origin URL variants: diagnostic only; success remains schema-only because TLS is bypassed.
          if [ "$LIVE_OK" -eq 0 ]; then
            python - <<'PY' > /tmp/candidates.txt
          from urllib.parse import urlparse
          from pathlib import Path
          u=Path('/tmp/ciis_snapshot_url.txt').read_text().strip()
          if u:
              p=urlparse(u)
              path=p.path
              c=[]
              for scheme in ('https','http'):
                  for host in ('www.ciis.com.hk','ciis.com.hk'):
                      c.append(f'{scheme}://{host}{path}')
              for x in dict.fromkeys(c): print(x)
          PY
            while IFS= read -r CAND; do
              [ -n "$CAND" ] || continue
              set +e
              STATUS=$(curl -k -L -A 'Mozilla/5.0 FactorLabResearch/1.0' --connect-timeout 15 --max-time 90 -sS -o /tmp/candidate.xlsx -w '%{http_code}' "$CAND")
              RC=$?
              set -e
              printf '%s\t%s\t%s\n' "$RC" "$STATUS" "$CAND" >> "$OUT/live_variant_probe.tsv"
              if [ "$RC" -eq 0 ] && [ "$STATUS" = '200' ] && [ -s /tmp/candidate.xlsx ]; then
                cp /tmp/candidate.xlsx "$OUT/20221206_Sample_CFF_Snapshot.xlsx"
                printf 'ciis_live_variant\n' > /tmp/acquisition_route.txt
                printf '%s\n' "$CAND" > "$OUT/resolved_download_url.txt"
                LIVE_OK=1
                break
              fi
            done < /tmp/candidates.txt
          fi

          # If the live public link is dead, try Internet Archive only for historical schema discovery.
          if [ "$LIVE_OK" -eq 0 ]; then
            EXACT="${URL:-https://www.ciis.com.hk/hongkong/en/historicaldata1/sampledata/20221206_Sample_CFF_Snapshot.xlsx}"
            CDX="https://web.archive.org/cdx/search/cdx?url=${EXACT}&output=json&filter=statuscode:200&fl=timestamp,original,statuscode,mimetype&collapse=digest"
            set +e
            curl -fL --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0 FactorLabResearch/1.0' "$CDX" -o /tmp/cdx.json
            CDX_RC=$?
            set -e
            printf '%s\n' "$CDX_RC" > "$OUT/internet_archive_cdx_curl_rc.txt"
            if [ "$CDX_RC" -eq 0 ]; then
              cp /tmp/cdx.json "$OUT/internet_archive_cdx.json"
              python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cdx.json')
          try: rows=json.loads(p.read_text())
          except Exception: rows=[]
          rec=None
          if isinstance(rows,list) and len(rows)>1:
              hdr=rows[0]
              for r in reversed(rows[1:]):
                  d=dict(zip(hdr,r))
                  if d.get('statuscode')=='200': rec=d; break
          if rec:
              Path('/tmp/archive_url.txt').write_text(f"https://web.archive.org/web/{rec['timestamp']}id_/{rec['original']}")
              Path('/tmp/archive_meta.json').write_text(json.dumps(rec,indent=2))
          else:
              Path('/tmp/archive_url.txt').write_text('')
          PY
              ARCH="$(cat /tmp/archive_url.txt)"
              if [ -n "$ARCH" ]; then
                cp /tmp/archive_meta.json "$OUT/internet_archive_selected_capture.json"
                set +e
                STATUS=$(curl -fL --connect-timeout 20 --max-time 180 -A 'Mozilla/5.0 FactorLabResearch/1.0' -sS -o /tmp/archive_sample.xlsx -w '%{http_code}' "$ARCH")
                RC=$?
                set -e
                printf '%s\t%s\t%s\n' "$RC" "$STATUS" "$ARCH" > "$OUT/internet_archive_download_status.tsv"
                if [ "$RC" -eq 0 ] && [ "$STATUS" = '200' ] && [ -s /tmp/archive_sample.xlsx ]; then
                  cp /tmp/archive_sample.xlsx "$OUT/20221206_Sample_CFF_Snapshot.xlsx"
                  printf 'internet_archive_of_ciis_public_sample\n' > /tmp/acquisition_route.txt
                  printf '%s\n' "$ARCH" > "$OUT/resolved_download_url.txt"
                fi
              fi
            fi
          fi

          printf '%s\n' "$PAGE" > "$OUT/source_page_url.txt"
          if [ ! -f "$OUT/resolved_download_url.txt" ]; then printf '%s\n' "$URL" > "$OUT/resolved_download_url.txt"; fi
          if [ ! -f /tmp/acquisition_route.txt ]; then printf 'none\n' > /tmp/acquisition_route.txt; fi
          cp /tmp/acquisition_route.txt "$OUT/acquisition_route.txt"

      - name: Inspect workbook if acquired and freeze receipt
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet openpyxl
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          from datetime import datetime, timezone
          import openpyxl

          root=Path('research/r1b_mo_data_admission/source_samples/ciis_cffex_snapshot_20221206')
          xlsx=root/'20221206_Sample_CFF_Snapshot.xlsx'
          route=(root/'acquisition_route.txt').read_text().strip()
          listing=json.loads((root/'listing_receipt.json').read_text())
          receipt={
              'research_identity':'rmr_R1B_MO_convex_impulse_mapping_v1',
              'scope':'non_event_conditioned_source_sample_acquisition_and_schema_inspection_only',
              'source_provider':'China Investment Information Services Limited (CIIS)',
              'target_filename':'20221206_Sample_CFF_Snapshot.xlsx',
              'current_official_listing_confirmed':listing['target_listed_on_current_page'],
              'current_live_url':listing['resolved_live_url'],
              'current_live_status':(root/'live_download_status.txt').read_text().strip(),
              'acquisition_route':route,
              'event_join_performed':False,
              'pnl_or_return_test_performed':False,
              'blackbox_query_count_before':3,
              'blackbox_query_count_after':3,
              'production_authority':False,
              'acquired_at_utc':datetime.now(timezone.utc).isoformat(),
          }
          schema={'sheets':[]}
          if xlsx.exists() and xlsx.stat().st_size>0 and zipfile.is_zipfile(xlsx):
              raw=xlsx.read_bytes()
              wb=openpyxl.load_workbook(xlsx,read_only=True,data_only=True)
              tokens=['SecurityID','DateTime','LastPrice','Volume','OpenInterest','BidPrice','BidVolume','AskPrice','AskVolume']
              hits={t:[] for t in tokens}
              for ws in wb.worksheets:
                  preview=[]
                  for r_idx,row in enumerate(ws.iter_rows(values_only=True),start=1):
                      vals=[None if v is None else str(v) for v in row]
                      if r_idx<=12: preview.append({'row':r_idx,'values':vals[:100]})
                      joined=' | '.join(v or '' for v in vals)
                      for t in tokens:
                          if t.lower() in joined.lower(): hits[t].append({'sheet':ws.title,'row':r_idx})
                      if r_idx>=50: break
                  schema['sheets'].append({'title':ws.title,'max_row':ws.max_row,'max_column':ws.max_column,'preview_first_12_rows':preview})
              receipt.update({
                  'file_acquired':True,
                  'sha256':hashlib.sha256(raw).hexdigest(),
                  'byte_size':len(raw),
                  'zip_container_valid':True,
                  'workbook_sheet_count':len(wb.sheetnames),
                  'sheet_names':wb.sheetnames,
                  'token_hits_first_50_rows':hits,
                  'transport_tls_verified': False if route.startswith('ciis_live') else None,
                  'official_live_bytes': route.startswith('ciis_live'),
                  'admission_decision':'ACQUIRED_SCHEMA_DISCOVERY_ONLY_NOT_ADMITTED'
              })
          else:
              receipt.update({
                  'file_acquired':False,
                  'official_live_bytes':False,
                  'admission_decision':'CURRENT_PUBLIC_LISTING_CONFIRMED_SAMPLE_BYTES_UNAVAILABLE_NOT_ADMITTED'
              })
          (root/'sample_acquisition_receipt.json').write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          (root/'sample_schema_preview.json').write_text(json.dumps(schema,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2,ensure_ascii=False))
          PY

      - name: Commit acquisition evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/r1b_mo_data_admission/source_samples/ciis_cffex_snapshot_20221206
          if git diff --cached --quiet; then
            echo 'No acquisition evidence changes'
          else
            git commit -m 'data: freeze CIIS CFFEX Snapshot acquisition receipt [skip ci]'
            git push origin HEAD:main
          fi

      - name: Upload acquisition evidence
        uses: actions/upload-artifact@v4
        with:
          name: ciis-cffex-snapshot-sample-20221206
          path: research/r1b_mo_data_admission/source_samples/ciis_cffex_snapshot_20221206/
          if-no-files-found: error
