name: r5-b1-limited-diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r5-b1-limited-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: python -m pip install --quiet numpy pandas pyarrow

      - name: Materialize exact historical frozen R5 source
        run: |
          set -euo pipefail
          FROZEN=/tmp/two-wave-r5-frozen
          git init "$FROZEN"
          git -C "$FROZEN" remote add origin https://github.com/staryocean0/factorlab-two-wave-strategy-lab.git
          git -C "$FROZEN" fetch --depth 1 origin cf8397c12a9defa243dc272224dedebe6ccd3251
          git -C "$FROZEN" checkout --detach FETCH_HEAD
          test "$(git -C "$FROZEN" rev-parse HEAD)" = "cf8397c12a9defa243dc272224dedebe6ccd3251"
          test "$(git -C "$FROZEN" hash-object scripts/run_broad_rmr_R5_multiscale_serial_dependence.py)" = "cd0ac94f7f8dc4fba7c9ee25701bcca02f551f2a"
          test "$(sha256sum "$FROZEN/data/development/5m_offset_0.parquet" | awk '{print $1}')" = "bea21fa9dd9532e21605511e07561b33d5569f86f69f5a487507531593b14c48"

      - name: Stage exact frozen R5 input and runner under current ownership
        run: |
          set -euo pipefail
          mkdir -p data/research_inputs/r5_b1 research/rmr_r5_b1/frozen_source
          cp /tmp/two-wave-r5-frozen/data/development/5m_offset_0.parquet data/research_inputs/r5_b1/5m_offset_0.parquet
          cp /tmp/two-wave-r5-frozen/scripts/run_broad_rmr_R5_multiscale_serial_dependence.py research/rmr_r5_b1/frozen_source/run_broad_rmr_R5_multiscale_serial_dependence.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('data/research_inputs/r5_b1/5m_offset_0.parquet')
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          if h != 'bea21fa9dd9532e21605511e07561b33d5569f86f69f5a487507531593b14c48':
              raise SystemExit('staged data SHA mismatch')
          manifest = {
              'schema_id': 'trend_reversion_r5_b1_frozen_input@1.0',
              'research_identity': 'R5_multiscale_serial_dependence_state_v1',
              'source_repository': 'staryocean0/factorlab-two-wave-strategy-lab',
              'source_commit': 'cf8397c12a9defa243dc272224dedebe6ccd3251',
              'source_path': 'data/development/5m_offset_0.parquet',
              'target_path': 'data/research_inputs/r5_b1/5m_offset_0.parquet',
              'sha256': h,
              'rows': 70114,
              'symbol': '000852.SH',
              'date_range': '2015-01-05..2020-12-31',
              'runner_source_path': 'scripts/run_broad_rmr_R5_multiscale_serial_dependence.py',
              'runner_git_blob': 'cd0ac94f7f8dc4fba7c9ee25701bcca02f551f2a',
              'current_market_partition_equivalence': 'not_established_and_not_required_for_exact_frozen_reproduction',
              'BLACKBOX_read': False,
              'post_2020_read': False,
              'production_authority': False,
          }
          Path('data/research_inputs/r5_b1/manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - name: Execute the preregistered R5-B1 limited diagnostic
        run: |
          set -euo pipefail
          python research/rmr_r5_b1/run_exact_frozen_input_diagnostic.py \
            --data data/research_inputs/r5_b1/5m_offset_0.parquet \
            --frozen-runner research/rmr_r5_b1/frozen_source/run_broad_rmr_R5_multiscale_serial_dependence.py \
            --output research/rmr_r5_b1/outputs/limited_diagnostic_receipt.json

      - name: Write compact research review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('research/rmr_r5_b1/outputs/limited_diagnostic_receipt.json').read_text())
          b = r['daily_breadth']
          s = r['anti_persistence_monotonic_shape']
          lines = [
              '# R5-B1 limited diagnostic result',
              '',
              'Date: 2026-09-10',
              '',
              f"Adjudication: `{r['adjudication']}`",
              '',
              '## Exact input identity',
              '',
              f"Frozen source SHA256: `{r['source_data_sha256']}`.",
              f"Rows: {r['source_rows']:,}; dates: {r['source_min_day']}..{r['source_max_day']}.",
              'Current annual market partitions were not used; their exact equivalence to the frozen R5 single-file source remains unestablished.',
              '',
              '## Diagnostic 1 — breadth across validation days',
              '',
              f"Supported: **{b['supported']}**.",
              f"Positive days: {b['positive_days']}/{b['validation_days']} ({b['positive_day_fraction']:.2%}).",
              f"2019 total SSE gain: {b['year_total_SSE_gain']['2019']:.12g}.",
              f"2020 total SSE gain: {b['year_total_SSE_gain']['2020']:.12g}.",
              f"Top 10% positive-day concentration: {b['positive_gain_top10pct_concentration']:.2%}.",
              '',
              '## Diagnostic 2 — anti-persistence monotonic shape',
              '',
              f"Supported: **{s['supported']}**.",
              f"Adjacent non-increasing slope steps: {s.get('adjacent_nonincreasing_steps')} / 4.",
              f"Spearman(anti-persistence, empirical slope): {s.get('spearman_anti_vs_slope')}.",
              f"Strongest quintile more negative than weakest: {s.get('strongest_more_negative_than_weakest')}.",
              '',
              'Validation pooled slopes by TRAIN-frozen anti-persistence quintile:',
              '',
          ]
          for x in s.get('bins', []):
              lines.append(f"- Q{x['quintile']}: n={x['VALIDATION_n']}, median anti={x['VALIDATION_median_anti_persistence']:.8g}, slope={x['VALIDATION_pooled']['slope']:.8g}")
          lines += [
              '',
              '## Authority',
              '',
              '- TRAIN/VALIDATION reusable evidence only.',
              '- BLACKBOX not read or allocated.',
              '- No PnL/Sharpe or trading mapping.',
              '- `production_authority=false`.',
          ]
          Path('docs/research/R5_B1_LIMITED_DIAGNOSTIC_RESULT_20260910.md').write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit migrated input, receipt and review
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research_inputs/r5_b1 research/rmr_r5_b1/frozen_source research/rmr_r5_b1/outputs/limited_diagnostic_receipt.json docs/research/R5_B1_LIMITED_DIAGNOSTIC_RESULT_20260910.md
          git commit -m "research: migrate frozen R5 input and adjudicate B1 diagnostic [skip ci]"
          git push origin HEAD:main
