name: r1a-evidence-closeout

on:
  workflow_dispatch:
  push:
    branches: [research/r1a-evidence-closeout-v1]
    paths: ['.github/workflows/r1a-evidence-closeout.yml']

permissions:
  contents: write

concurrency:
  group: r1a-evidence-closeout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  existing-evidence-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pyproject.toml
            /src/
            /shared/
            /research/r1a_evidence_closeout/
            /tests/test_r1a_evidence_closeout.py
            /docs/governance/R1A_EVIDENCE_CLOSEOUT_FREEZE@1.0.json
            /docs/ops/evidence/r1a_walkforward_prediction_20260912/
            /docs/ops/evidence/r1a_development_noise_20260912/development_pairs.csv
            /docs/ops/evidence/r1a_evidence_closeout_20260912/
            /docs/research/INDEX_PRICE_VALIDITY_STUDY_20260911.md
            /docs/research/R1_INCREMENTAL_ALPHA_PROGRAM_DECISION_20260911.md
            /docs/research/R1A_ENDPOINT_METHOD_REVIEW_20260912.md
            /docs/research/R1A_ENDPOINT_ROBUSTNESS_REVIEW_20260912.md
            /docs/research/R1A_CONFIRMATION_FEASIBILITY_REVIEW_20260912.md
            /docs/research/R1A_METHOD_CALIBRATION_REVIEW_20260912.md
            /docs/research/R1A_DEVELOPMENT_NOISE_REVIEW_20260912.md
            /docs/research/R1A_CAUSAL_CONTROL_DESIGN_REVIEW_20260912.md
            /docs/research/R1A_WALKFORWARD_PREDICTION_REVIEW_20260912.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Align inherited score-group identifiers before first execution
        env:
          RESEARCH_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/r1a_evidence_closeout/audit.py')
          s=p.read_text()
          old="'YEAR_SIDE_'+str(year)"
          assert s.count(old)==1
          p.write_text(s.replace(old,"'YEAR_'+str(year)"))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse research/r1a_evidence_closeout/audit.py
          git commit -m 'fix(audit): align stored year-side score keys before first calculation [skip ci]'
          git push origin "HEAD:$RESEARCH_BRANCH"
      - name: Install package
        run: python -m pip install -e .
      - name: Test exact algebra and no-fit boundary
        run: python -m pytest -q tests/test_r1a_evidence_closeout.py
      - name: Enforce existing-evidence-only source access
        run: |
          python - <<'PY'
          from pathlib import Path
          assert not Path('data').exists()
          assert not list(Path('.').rglob('*.parquet'))
          assert not Path('research/r1a_walkforward_prediction').exists()
          assert not Path('docs/ops/evidence/r1a_control_design_20260912/allocation_ledger.csv').exists()
          print('No raw market data, prior fitter, selected-control outcomes or 2026 candidate present.')
          PY
      - name: Execute frozen reconciliation and error accounting
        run: python research/r1a_evidence_closeout/audit.py --output docs/ops/evidence/r1a_evidence_closeout_20260912
      - name: Commit new evidence without overwriting prior studies
        env:
          RESEARCH_BRANCH: ${{ github.ref_name }}
        run: |
          git add --sparse docs/ops/evidence/r1a_evidence_closeout_20260912
          git commit -m 'audit: retain deterministic R1_A cross-study and forecast-error accounting [skip ci]'
          git push origin "HEAD:$RESEARCH_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-evidence-closeout-${{ github.run_id }}
          path: |
            docs/ops/evidence/r1a_evidence_closeout_20260912
            research/r1a_evidence_closeout
          if-no-files-found: error
