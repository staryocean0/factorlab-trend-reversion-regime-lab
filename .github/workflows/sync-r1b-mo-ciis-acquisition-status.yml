name: sync-r1b-mo-ciis-acquisition-status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-r1b-mo-ciis-acquisition-status.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Synchronize authority entry points
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('CONTINUE_HERE.md')
          s=p.read_text(encoding='utf-8')

          old='- the actual public Snapshot XLSX bytes have **not** yet been retrieved in this research session, so there is no sample checksum/row-count/file-level admission receipt;'
          new='- the current CIIS sample page was re-checked on 2026-09-10 and still explicitly lists `20221206_Sample_CFF_Snapshot.xlsx`, but the listed live href and all same-path www/non-www HTTP/HTTPS variants return 404;\n- an exact-URL Internet Archive CDX lookup returned no captures, so no sample XLSX bytes, checksum, row count or workbook-level mapping were recovered; the acquisition state is `CIIS_PUBLIC_SAMPLE_LISTING_CONFIRMED_LINK_DEAD_EXTERNAL_DELIVERY_REQUIRED`;'
          if old not in s:
              raise SystemExit('Expected public-sample status sentence not found in CONTINUE_HERE.md')
          s=s.replace(old,new,1)

          old_state='`CFFEX_LEVEL2_CORE_FIELD_CAPABILITY_CONFIRMED_CIIS_OFFICIAL_ROUTE_IDENTIFIED_DELIVERY_NOT_YET_ADMITTED`'
          new_state='`CFFEX_LEVEL2_CORE_FIELD_CAPABILITY_CONFIRMED_CIIS_PUBLIC_SAMPLE_LISTED_LINK_DEAD_EXTERNAL_DELIVERY_REQUIRED`'
          if old_state not in s:
              raise SystemExit('Expected source-level state not found in CONTINUE_HERE.md')
          s=s.replace(old_state,new_state,1)

          old_action='1. obtain the public/non-event-conditioned CIIS CFFEX Snapshot sample `20221206_Sample_CFF_Snapshot.xlsx` or a current equivalent sample;'
          new_action='1. obtain a current equivalent non-event-conditioned CIIS/CFFEX Snapshot sample or proceed to the official full delivery; the currently listed `20221206_Sample_CFF_Snapshot.xlsx` link has already been re-checked and returns 404; do not repeat blind retrieval of that same dead URL;'
          if old_action not in s:
              raise SystemExit('Expected next-action sample sentence not found in CONTINUE_HERE.md')
          s=s.replace(old_action,new_action,1)

          anchor='5. `docs/research/R1B_MO_CIIS_ACQUISITION_ROUTE_20260910.md`\n'
          addition='6. `docs/research/R1B_MO_CIIS_SAMPLE_ACQUISITION_RESULT_20260910.md`\n'
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('Read-first anchor not found')
              s=s.replace(anchor,anchor+addition,1)
              # Renumber the remaining read-first list only in its final block.
              s=s.replace('6. `docs/research/R1B_MO_DATA_SOURCE_ADMISSION_STATUS_20260910.md`','7. `docs/research/R1B_MO_DATA_SOURCE_ADMISSION_STATUS_20260910.md`',1)
              s=s.replace('7. `docs/research/R1B_MO_FEE_SOURCE_STATUS_20260910.md`','8. `docs/research/R1B_MO_FEE_SOURCE_STATUS_20260910.md`',1)
              s=s.replace('8. `docs/research/R5_B1_LIMITED_DIAGNOSTIC_RESULT_20260910.md`','9. `docs/research/R5_B1_LIMITED_DIAGNOSTIC_RESULT_20260910.md`',1)
              s=s.replace('9. `docs/DATA.md`','10. `docs/DATA.md`',1)
              s=s.replace('10. `docs/RESEARCH_GOVERNANCE.md`','11. `docs/RESEARCH_GOVERNANCE.md`',1)

          p.write_text(s,encoding='utf-8')

          q=Path('docs/research/R1B_MO_DATA_SOURCE_ADMISSION_STATUS_20260910.md')
          t=q.read_text(encoding='utf-8')
          marker='## 2026-09-10 public-sample retrieval update'
          if marker not in t:
              t += f'''\n\n{marker}\n\nThe current CIIS public sample page was re-checked from a GitHub-hosted runner. It still lists `20221206_Sample_CFF_Snapshot.xlsx`, but the listed live href returns HTTP 404. Same-path www/non-www HTTP/HTTPS variants also return 404. An exact-URL Internet Archive CDX lookup returned no captures.\n\nFrozen receipt: `research/r1b_mo_data_admission/source_samples/ciis_cffex_snapshot_20221206/sample_acquisition_receipt.json`.\n\nDecision: `CIIS_PUBLIC_SAMPLE_LISTING_CONFIRMED_LINK_DEAD_EXTERNAL_DELIVERY_REQUIRED`.\n\nNo sample bytes were acquired and no admission status was upgraded. The next source action is a current equivalent non-event-conditioned sample or official full delivery from CIIS/CFFEX.\n'''
              q.write_text(t,encoding='utf-8')
          PY

      - name: Commit synchronized authority state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CONTINUE_HERE.md docs/research/R1B_MO_DATA_SOURCE_ADMISSION_STATUS_20260910.md
          if git diff --cached --quiet; then
            echo 'No authority synchronization changes'
          else
            git commit -m 'research: sync CIIS sample acquisition blocker [skip ci]'
            git push origin HEAD:main
          fi
