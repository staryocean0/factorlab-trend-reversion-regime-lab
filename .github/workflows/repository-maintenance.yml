name: repository-maintenance-apply-once
on:
  workflow_dispatch:
  push:
    branches: [maintenance/repository-consistency-20260912]
    paths: ['.github/workflows/repository-maintenance.yml']
permissions:
  contents: write
concurrency:
  group: repository-maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            !/docs/ops/evidence/
            /docs/ops/evidence/etf_day_reconciliation_20260912/receipt.json
      - name: Fetch baseline tree without fetching excluded data
        run: git fetch --no-tags --filter=blob:none --depth=1 origin b4d023b100c49c7dbaa44e81417d7a0386a5b004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare and validate the intended final migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/archive/repository_maintenance_20260912/apply.py')
          text=p.read_text()
          old="write(ARCHIVE+'/README.md'"
          assert text.count(old)==1
          p.write_text(text.replace(old,"write(ARCHIVE+'/ARCHIVE_INDEX.md'"))
          PY
          python docs/archive/repository_maintenance_20260912/apply.py
          python scripts/repository_consistency.py --render
          rm .github/workflows/repository-maintenance.yml
          git add --sparse -A
      - run: python -m pip install -e '.[maintenance]'
      - name: Validate all generated links, roles and unchanged scientific inputs
        run: python scripts/repository_consistency.py --check --output "$RUNNER_TEMP/migration-consistency.json"
      - name: Test new maintenance safeguards
        run: python -m pytest -q tests/test_repository_consistency.py --junitxml="$RUNNER_TEMP/maintenance-tests.xml"
      - name: Retain exact final workflow bytes for connector publication
        run: |
          python - <<'PY'
          import os,zipfile,json,hashlib
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'final-workflows.zip'
          specs=[]
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path('.github/workflows').glob('*.yml')):
                  b=p.read_bytes();z.writestr(str(p),b)
                  specs.append({'path':str(p),'sha256':hashlib.sha256(b).hexdigest()})
              z.writestr('workflow_manifest.json',json.dumps(specs,indent=2))
          PY
      - name: Publish non-workflow migration only; connector completes the final tree
        run: |
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'chore: stage synchronized components; workflow publication pending on maintenance branch [skip ci]'
          git push origin HEAD:maintenance/repository-consistency-20260912
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-migration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/migration-consistency.json
            ${{ runner.temp }}/maintenance-tests.xml
            ${{ runner.temp }}/final-workflows.zip
            docs/REPOSITORY_STATE.json
            docs/maintenance/BASELINE_COMPONENTS.json
          if-no-files-found: warn
