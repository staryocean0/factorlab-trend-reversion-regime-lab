name: reversal-first-passage-v0-8

on:
  push:
    branches:
      - research/reversal-first-passage-v0-8
    paths:
      - '.github/workflows/reversal-first-passage.yml'
      - 'src/regime_lab/first_passage.py'
      - 'tests/test_first_passage.py'
      - 'scripts/run_reversal_first_passage_v0_8.py'
      - 'src/regime_lab/reversal_mean_reversion.py'
      - 'src/regime_lab/robust_mean_reversion.py'
      - 'src/regime_lab/market_data.py'
      - 'data/market/5m/**'
      - 'data/manifest.json'

permissions:
  contents: read

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Validate sealed seed files remain unchanged
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from regime_lab.package_guard import public_files

          root = Path('.').resolve()
          public_files(root)
          manifest = json.loads((root / 'docs/seed_manifest.json').read_text())
          missing = []
          mismatched = []
          for row in manifest['files']:
              path = root / row['path']
              if not path.exists():
                  missing.append(row['path'])
                  continue
              with path.open('rb') as handle:
                  actual = hashlib.file_digest(handle, 'sha256').hexdigest()
              if actual != row['sha256']:
                  mismatched.append(row['path'])
          assert not missing, f'missing sealed seed files: {missing}'
          assert not mismatched, f'modified sealed seed files: {mismatched}'
          print({'status': 'passed', 'sealed_seed_files': len(manifest['files'])})
          PY
      - name: Validate original main seed snapshot
        run: |
          git fetch --depth=1 origin main
          git worktree add /tmp/seed-main FETCH_HEAD
          (cd /tmp/seed-main && python scripts/validate_seed.py)
      - run: python -m pytest -q
      - run: python scripts/run_reversal_first_passage_v0_8.py
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-first-passage-v0-8
          path: artifacts/reversal_first_passage_v0_8/
          if-no-files-found: error
