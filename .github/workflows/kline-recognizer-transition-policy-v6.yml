name: kline-recognizer-transition-policy-v6-once

on:
  push:
    branches:
      - research/kline-recognizer-transition-policy-v6
    paths:
      - .github/workflows/kline-recognizer-transition-policy-v6.yml

# rerun revision 2 after importing immutable v5 summary snapshot

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/kline-recognizer-transition-policy-v6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Validate immutable market package
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pyarrow.parquet as pq
          root = Path('.').resolve()
          manifest = json.loads((root / 'data/manifest.json').read_text())
          counts = {}
          for item in manifest['files']:
              path = root / item['path']
              with path.open('rb') as handle:
                  actual = hashlib.file_digest(handle, 'sha256').hexdigest()
              assert actual == item['sha256'], item['path']
              pf = pq.ParquetFile(path)
              assert pf.metadata.num_rows == item['rows'], item['path']
              frame = pf.read(columns=['symbol', 'trading_day']).to_pandas()
              assert set(frame['symbol']) == {item['symbol']}, item['path']
              assert frame['trading_day'].min() == item['first_day'], item['path']
              assert frame['trading_day'].max() == item['last_day'], item['path']
              assert item['last_day'] <= '2025-12-31', item['path']
              key = f"{item['symbol']}:{item['frequency']}"
              counts[key] = counts.get(key, 0) + len(frame)
          print(json.dumps({'status':'passed','partitions':len(manifest['files']),'rows':counts}, ensure_ascii=False))
          PY
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run frozen v6 transition policy
        run: python scripts/run_kline_transition_policy_v6.py --code-commit "$(git rev-parse HEAD)"
      - name: Commit immutable v6 result bundle
        run: |
          git config user.name "factorlab-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/kline_recognizer_transition_policy_v6
          git commit -m "[skip ci] record K-line transition policy v6 results" || exit 0
          git push origin HEAD:research/kline-recognizer-transition-policy-v6
