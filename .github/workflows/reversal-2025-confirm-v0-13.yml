name: reversal-2025-confirm-v0-13

on:
  push:
    branches:
      - research/reversal-2025-confirm-v0-13
    paths:
      - '.github/workflows/reversal-2025-confirm-v0-13.yml'
      - 'docs/research/V0_13_2025_CONFIRMATION_PROTOCOL.md'
      - 'src/regime_lab/barrier_policy.py'
      - 'tests/test_barrier_policy.py'
      - 'scripts/run_reversal_2025_confirmation_v0_13.py'
      - 'src/regime_lab/reversal_mean_reversion.py'
      - 'src/regime_lab/robust_mean_reversion.py'
      - 'src/regime_lab/market_data.py'
      - 'data/market/1m/000852.SH/**'
      - 'data/market/5m/000852.SH/**'
      - 'data/manifest.json'

permissions:
  contents: read

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Validate sealed seed files remain unchanged
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from regime_lab.package_guard import public_files
          root = Path('.').resolve()
          public_files(root)
          manifest = json.loads((root / 'docs/seed_manifest.json').read_text())
          missing, mismatched = [], []
          for row in manifest['files']:
              path = root / row['path']
              if not path.exists():
                  missing.append(row['path']); continue
              with path.open('rb') as handle:
                  actual = hashlib.file_digest(handle, 'sha256').hexdigest()
              if actual != row['sha256']:
                  mismatched.append(row['path'])
          assert not missing, missing
          assert not mismatched, mismatched
          print({'status': 'passed', 'sealed_seed_files': len(manifest['files'])})
          PY
      - name: Verify preregistration predates execution commit
        run: |
          test -f docs/research/V0_13_2025_CONFIRMATION_PROTOCOL.md
          git log --format='%H %s' -- docs/research/V0_13_2025_CONFIRMATION_PROTOCOL.md
      - name: Validate original main seed snapshot
        run: |
          git fetch --depth=1 origin main
          git worktree add /tmp/seed-main FETCH_HEAD
          (cd /tmp/seed-main && python scripts/validate_seed.py)
      - run: python -m pytest -q
      - run: python scripts/run_reversal_2025_confirmation_v0_13.py
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-2025-confirm-v0-13
          path: artifacts/reversal_2025_confirmation_v0_13/
          if-no-files-found: error
