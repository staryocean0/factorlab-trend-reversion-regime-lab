name: discover-cffex-official-materials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-cffex-official-materials.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch and preserve official CFFEX acquisition materials
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          PAGE = 'https://www.cffex.com.cn/zlxz/'
          TARGETS = [
              '中金所历史行情数据内容及申购流程',
              '中金所历史行情数据申购表',
              '价目表（境内）',
          ]
          UA = {'User-Agent': 'Mozilla/5.0 research-provenance/1.0'}

          req = urllib.request.Request(PAGE, headers=UA)
          with urllib.request.urlopen(req, timeout=60) as r:
              html = r.read().decode('utf-8', errors='replace')

          class AParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.cur=None; self.buf=[]; self.rows=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'a':
                      self.cur = dict(attrs).get('href'); self.buf=[]
              def handle_data(self, data):
                  if self.cur is not None: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'a' and self.cur is not None:
                      text = re.sub(r'\s+', ' ', ''.join(self.buf)).strip()
                      self.rows.append((text, self.cur)); self.cur=None; self.buf=[]

          p=AParser(); p.feed(html)
          matched=[]
          for target in TARGETS:
              hits=[(t,h) for t,h in p.rows if target in t]
              if not hits:
                  raise SystemExit(f'Missing official link for {target}')
              text, href = hits[0]
              matched.append((target, text, urljoin(PAGE, href)))

          outdir=Path('docs/external/cffex/official_materials_20260910')
          outdir.mkdir(parents=True, exist_ok=True)
          records=[]
          for idx,(target,text,url) in enumerate(matched,1):
              req=urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=120) as r:
                  raw=r.read(); ctype=r.headers.get('Content-Type'); final=r.geturl()
              path=urlparse(final).path
              suffix=Path(path).suffix or '.bin'
              safe={
                  '中金所历史行情数据内容及申购流程':'historical_data_content_and_purchase_process',
                  '中金所历史行情数据申购表':'historical_data_purchase_form',
                  '价目表（境内）':'domestic_price_list',
              }[target] + suffix
              fp=outdir/safe
              fp.write_bytes(raw)
              records.append({
                  'target_label': target,
                  'anchor_text': text,
                  'source_page': PAGE,
                  'source_url': url,
                  'final_url': final,
                  'content_type': ctype,
                  'repository_path': str(fp),
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              })
          manifest={
              'retrieved_utc':'2026-09-10',
              'purpose':'R1B MO instrument-data acquisition support only; no event-conditioned outcomes inspected',
              'source_domain':'www.cffex.com.cn',
              'records':records,
              'production_authority':False,
              'blackbox_query_count':3,
          }
          (outdir/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Commit official materials and provenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/external/cffex/official_materials_20260910
          if git diff --cached --quiet; then
            echo "No material changes"
          else
            git commit -m "data: preserve official CFFEX acquisition materials [skip ci]"
            git push origin HEAD:main
          fi
