name: control-design-regression

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: r1a-control-design-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control-design-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research/r1a_control_design
            research/r1a_development_noise
            research/index_price_validity/core.py
            research/r1_incremental_alpha_attribution/core.py
            tests/test_r1a_control_design.py
            tests/test_control_design_retained.py
            docs/governance/R1A_CAUSAL_CONTROL_DESIGN_FREEZE@1.0.json
            docs/governance/INDEX_PRICE_VALIDITY_FREEZE@1.0.json
            docs/ops/evidence/r1a_development_noise_20260912/development_pairs.csv
            docs/ops/evidence/r1a_control_design_20260912
            data/manifest.json
            data/market/1m/000852.SH/2015.parquet
            data/market/1m/000852.SH/2016.parquet
            data/market/1m/000852.SH/2017.parquet
            data/market/1m/000852.SH/2018.parquet
            data/market/1m/000852.SH/2019.parquet
            data/market/1m/000852.SH/2020.parquet
            data/market/1m/000688.SH/2020.parquet
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Test causal prefixes, retained losses and capacity implications
        run: python -m pytest -q tests/test_r1a_control_design.py tests/test_control_design_retained.py
      - name: Enforce original Development access and no return ledgers
        run: |
          python - <<'PY'
          from pathlib import Path
          prices=list(Path('data').rglob('*.parquet'))
          assert len(prices)==7
          assert all(p.stem in {'2015','2016','2017','2018','2019','2020'} for p in prices)
          assert not Path('data/r1a_carrier_prices').exists()
          assert not Path('docs/ops/evidence/r1a_endpoint_diagnostic_20260912').exists()
          assert not Path('docs/ops/evidence/r1a_development_noise_20260912/development_leg_returns_NOT_confirmation.csv').exists()
          print('Only seven original Development price partitions; new allocation outcomes remain unopened.')
          PY
      - name: Reproduce sealed design screen without retuning
        run: |
          python research/r1a_control_design/study.py --output "$RUNNER_TEMP/r1a-control-design-replay"
          python research/r1a_control_design/verify_replay.py \
            --reference docs/ops/evidence/r1a_control_design_20260912 \
            --replay "$RUNNER_TEMP/r1a-control-design-replay" \
            --output "$RUNNER_TEMP/r1a-control-design-replay-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-control-design-replay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r1a-control-design-replay
            ${{ runner.temp }}/r1a-control-design-replay-audit.json
          if-no-files-found: warn
