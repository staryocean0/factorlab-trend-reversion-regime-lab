name: r1a-control-design

on:
  workflow_dispatch:
  push:
    branches: [research/r1a-causal-control-design-v1]
    paths: ['.github/workflows/r1a-control-design.yml']

permissions:
  contents: write

concurrency:
  group: r1a-control-design-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control-design:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research/r1a_control_design
            research/r1a_development_noise
            research/index_price_validity/core.py
            research/r1_incremental_alpha_attribution/core.py
            tests/test_r1a_control_design.py
            docs/governance/R1A_CAUSAL_CONTROL_DESIGN_FREEZE@1.0.json
            docs/governance/INDEX_PRICE_VALIDITY_FREEZE@1.0.json
            docs/ops/evidence/r1a_development_noise_20260912/development_pairs.csv
            docs/ops/evidence/r1a_control_design_20260912
            data/manifest.json
            data/market/1m/000852.SH/2015.parquet
            data/market/1m/000852.SH/2016.parquet
            data/market/1m/000852.SH/2017.parquet
            data/market/1m/000852.SH/2018.parquet
            data/market/1m/000852.SH/2019.parquet
            data/market/1m/000852.SH/2020.parquet
            data/market/1m/000688.SH/2020.parquet
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Test causal prefix and capacity boundaries
        run: python -m pytest -q tests/test_r1a_control_design.py
      - name: Enforce price and outcome source isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          prices=list(Path('data').rglob('*.parquet'))
          assert len(prices)==7
          assert all(p.stem in {'2015','2016','2017','2018','2019','2020'} for p in prices)
          assert not Path('data/r1a_carrier_prices').exists()
          assert not Path('docs/ops/evidence/r1a_endpoint_diagnostic_20260912').exists()
          assert not Path('docs/ops/evidence/r1a_development_noise_20260912/development_leg_returns_NOT_confirmation.csv').exists()
          print('Only seven original Development price partitions and no return ledger are present.')
          PY
      - name: Execute outcome-blind design screen
        run: python research/r1a_control_design/study.py --output docs/ops/evidence/r1a_control_design_20260912
      - name: Preserve design evidence on research branch
        if: github.ref == 'refs/heads/research/r1a-causal-control-design-v1'
        env:
          RESEARCH_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/r1a_control_design_20260912
          if ! git diff --cached --quiet; then
            git commit -m 'research: retain causal control design feasibility without outcomes [skip ci]'
            git push origin "HEAD:$RESEARCH_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-control-design-${{ github.run_id }}
          path: docs/ops/evidence/r1a_control_design_20260912
          if-no-files-found: warn
