name: etf-day-reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main, audit/etf-day-reconciliation-v1]
    paths:
      - '.github/workflows/etf-day-reconciliation.yml'
      - 'research/etf_day_reconciliation/**'
      - 'tests/test_etf_day_reconciliation.py'
      - 'docs/governance/ETF_DAY_RECONCILIATION_FREEZE@1.0.json'
permissions:
  contents: write
jobs:
  fixed-day-field-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/governance/ETF_DAY_RECONCILIATION_FREEZE@1.0.json
            /research/etf_day_reconciliation/
            /tests/test_etf_day_reconciliation.py
            /docs/ops/evidence/etf_day_reconciliation_20260912/
            /data/etf_microstructure_sample_20251201_v1/
            /data/r1a_carrier_prices/cloud_pack_v1/512100.SH.json
            /data/r1a_carrier_prices/cloud_pack_v1/588000.SH.json
            /data/r1a_carrier_prices/cloud_pack_v1/prices/512100_2025.csv
            /data/r1a_carrier_prices/cloud_pack_v1/prices/588000_2025.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pyarrow>=19,<22'
      - name: Test exact accounting and conservative interval boundaries
        run: python -m unittest discover -s tests -p test_etf_day_reconciliation.py -v
      - name: Verify narrow source scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('data/etf_microstructure_sample_20251201_v1')
          assert set(Path('data').rglob('*.parquet'))==set(p.rglob('*.parquet'))
          assert len(list(p.rglob('*.parquet')))==6
          assert not Path('data/market').exists()
          PY
      - name: Reconcile source fields without returns or fitted alignments
        run: python research/etf_day_reconciliation/audit.py --output "$RUNNER_TEMP/reconciliation"
      - name: Compare retained evidence when present
        run: |
          python - <<'PY'
          import os,hashlib
          from pathlib import Path
          old=Path('docs/ops/evidence/etf_day_reconciliation_20260912')
          new=Path(os.environ['RUNNER_TEMP'])/'reconciliation'
          if old.exists():
              assert {p.name for p in old.iterdir()}=={p.name for p in new.iterdir()}
              for p in old.iterdir(): assert p.read_bytes()==(new/p.name).read_bytes(),p.name
              print('EXACT_REPLAY_PASS_NOT_STRATEGY_EVIDENCE')
          else: print('INITIAL_RECONCILIATION_NO_PRIOR_RECEIPT')
          PY
      - name: Retain initial result only on the bounded audit branch
        if: github.ref == 'refs/heads/audit/etf-day-reconciliation-v1'
        run: |
          if [ ! -e docs/ops/evidence/etf_day_reconciliation_20260912 ]; then
            mkdir -p docs/ops/evidence/etf_day_reconciliation_20260912
            cp "$RUNNER_TEMP/reconciliation/"* docs/ops/evidence/etf_day_reconciliation_20260912/
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/ops/evidence/etf_day_reconciliation_20260912
            git commit -m 'audit: retain fixed-day field discrepancies without changing raw data [skip ci]'
            git push origin HEAD:audit/etf-day-reconciliation-v1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-day-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/reconciliation/
          if-no-files-found: warn
