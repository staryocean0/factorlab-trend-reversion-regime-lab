name: walkforward-prediction-regression

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: r1a-walkforward-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forward-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pyproject.toml
            /src/
            /shared/
            /research/index_price_validity/
            /research/r1_incremental_alpha_attribution/
            /research/r1a_development_noise/
            /research/r1a_walkforward_prediction/
            /tests/test_r1a_walkforward_prediction.py
            /tests/test_walkforward_prediction_retained.py
            /docs/governance/INDEX_PRICE_VALIDITY_FREEZE@1.0.json
            /docs/governance/R1A_WALKFORWARD_PREDICTION_FREEZE@1.0.json
            /docs/ops/evidence/r1a_development_noise_20260912/development_pairs.csv
            /docs/ops/evidence/r1a_walkforward_prediction_20260912/
            /data/manifest.json
            /data/market/1m/000852.SH/2015.parquet
            /data/market/1m/000852.SH/2016.parquet
            /data/market/1m/000852.SH/2017.parquet
            /data/market/1m/000852.SH/2018.parquet
            /data/market/1m/000852.SH/2019.parquet
            /data/market/1m/000852.SH/2020.parquet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Verify prediction boundaries and sealed evidence
        run: python -m pytest -q tests/test_r1a_walkforward_prediction.py tests/test_walkforward_prediction_retained.py
      - name: Verify original Development-only price access
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(str(p) for p in Path('data').rglob('*.parquet'))
          assert files == [f'data/market/1m/000852.SH/{y}.parquet' for y in range(2015,2021)], files
          assert not list(Path('data').rglob('*.csv'))
          assert not Path('docs/ops/evidence/r1a_control_design_20260912/allocation_ledger.csv').exists()
          print('Six pre2021 price files only; retained forecast evidence is a replay reference.')
          PY
      - name: Reproduce original forward forecasts without retuning
        run: |
          python research/r1a_walkforward_prediction/study.py --output "$RUNNER_TEMP/r1a-forward-replay"
          python research/r1a_walkforward_prediction/verify_replay.py \
            --reference docs/ops/evidence/r1a_walkforward_prediction_20260912 \
            --replay "$RUNNER_TEMP/r1a-forward-replay" --output "$RUNNER_TEMP/r1a-forward-replay-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-forward-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/r1a-forward-replay-audit.json
          if-no-files-found: warn
