name: r1a-walkforward-prediction

on:
  workflow_dispatch:
  push:
    branches: [research/r1a-walkforward-prediction-v1]
    paths: ['.github/workflows/r1a-walkforward-prediction.yml']

permissions:
  contents: write

concurrency:
  group: r1a-walkforward-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forward-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pyproject.toml
            /src/
            /shared/
            /research/index_price_validity/
            /research/r1_incremental_alpha_attribution/
            /research/r1a_development_noise/
            /research/r1a_walkforward_prediction/
            /tests/test_r1a_walkforward_prediction.py
            /docs/governance/INDEX_PRICE_VALIDITY_FREEZE@1.0.json
            /docs/governance/R1A_WALKFORWARD_PREDICTION_FREEZE@1.0.json
            /docs/ops/evidence/r1a_development_noise_20260912/development_pairs.csv
            /data/manifest.json
            /data/market/1m/000852.SH/2015.parquet
            /data/market/1m/000852.SH/2016.parquet
            /data/market/1m/000852.SH/2017.parquet
            /data/market/1m/000852.SH/2018.parquet
            /data/market/1m/000852.SH/2019.parquet
            /data/market/1m/000852.SH/2020.parquet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Verify mature labels and fixed forecast boundaries
        run: python -m pytest -q tests/test_r1a_walkforward_prediction.py
      - name: Verify original Development-only data access
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(str(p) for p in Path('data').rglob('*.parquet'))
          expected = [f'data/market/1m/000852.SH/{year}.parquet' for year in range(2015,2021)]
          assert files == expected, files
          assert not list(Path('data').rglob('*.csv'))
          assert not Path('docs/ops/evidence/r1a_development_noise_20260912/development_leg_returns_NOT_confirmation.csv').exists()
          assert not Path('docs/ops/evidence/r1a_control_design_20260912/allocation_ledger.csv').exists()
          print('Six original Development partitions only; no ETF, Validation or 2026 prices.')
          PY
      - name: Execute frozen expanding-year forecast diagnostic
        run: python research/r1a_walkforward_prediction/study.py --output docs/ops/evidence/r1a_walkforward_prediction_20260912
      - name: Retain decisive forecast evidence
        if: github.ref == 'refs/heads/research/r1a-walkforward-prediction-v1'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/r1a_walkforward_prediction_20260912
          if ! git diff --cached --quiet; then
            git commit -m 'research: retain fixed walk-forward predictions and all-event coverage [skip ci]'
            git push origin "HEAD:$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-walkforward-${{ github.run_id }}
          path: docs/ops/evidence/r1a_walkforward_prediction_20260912
          if-no-files-found: warn
