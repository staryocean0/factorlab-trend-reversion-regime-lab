name: legacy-price-statistics-replay

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  research-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research
            tests
            docs
            docs/ops/evidence/r1b_mo_outcome_20260911
            docs/ops/evidence/r1_incremental_alpha_20260911
            docs/ops/evidence/r1a_carrier_transport_20260912
            docs/ops/evidence/r1a_carrier_transport_20260912_local
            docs/ops/evidence/r1a_carrier_cloud_audit_20260912
            docs/ops/evidence/r1a_carrier_source_audit_20260912
            docs/ops/evidence/r1a_endpoint_diagnostic_20260912
            docs/ops/evidence/r1a_endpoint_robustness_20260912
            docs/ops/evidence/r1a_confirmation_feasibility_20260912
            docs/ops/evidence/r1a_method_calibration_20260912
            data/manifest.json
            data/market/1m
            data/r1a_carrier_prices
            data/r1b_research
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run MO, price-attribution, carrier, feasibility and method regression tests
        id: regression
        run: python -m pytest -q tests/test_r1b_mo_*.py tests/test_index_price_validity.py tests/test_r1_incremental_alpha_attribution.py tests/test_r1a_*.py
      - name: Reproduce original full-path ETF result from public CSV bytes
        run: python research/r1a_carrier_transport/verify_cloud_replay.py --output "$RUNNER_TEMP/r1a-public-csv-replay"
      - name: Reproduce separate endpoint diagnostic and reconcile frozen outputs
        run: |
          python research/r1a_carrier_transport/endpoint_diagnostic.py --output "$RUNNER_TEMP/r1a-endpoint-replay"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from research.r1a_carrier_transport.endpoint_diagnostic import sha
          from research.r1a_carrier_transport.audit_public_delivery import compare_json
          old = Path('docs/ops/evidence/r1a_endpoint_diagnostic_20260912')
          new = Path(os.environ['RUNNER_TEMP'])/'r1a-endpoint-replay'
          a = json.loads((old/'endpoint_receipt.json').read_text())
          b = json.loads((new/'endpoint_receipt.json').read_text())
          assert a['decision'] == b['decision']
          assert a['freeze_sha256'] == b['freeze_sha256']
          compare_json(b['carriers'], a['carriers'])
          for spec in a['evidence_files']:
              assert sha(new/spec['path']) == spec['sha256'], spec['path']
          print('Endpoint evidence reproduced; this is not new empirical certification.')
          PY
      - name: Reproduce retrospective robustness with pinned evidence and exact decisions
        run: |
          python research/r1a_endpoint_robustness/study.py --output "$RUNNER_TEMP/r1a-robustness-replay"
          python research/r1a_method_calibration/prior_replay_audit.py --stage robustness \
            --reference docs/ops/evidence/r1a_endpoint_robustness_20260912 \
            --replay "$RUNNER_TEMP/r1a-robustness-replay" \
            --output "$RUNNER_TEMP/r1a-robustness-replay-audit.json"
      - name: Reproduce fixed feasibility without new data-role probes
        run: |
          python research/r1a_confirmation_feasibility/study.py --output "$RUNNER_TEMP/r1a-feasibility-replay"
          python research/r1a_method_calibration/prior_replay_audit.py --stage feasibility \
            --reference docs/ops/evidence/r1a_confirmation_feasibility_20260912/planning \
            --replay "$RUNNER_TEMP/r1a-feasibility-replay" \
            --output "$RUNNER_TEMP/r1a-feasibility-replay-audit.json"
      - name: Reproduce fixed method-only simulations and audit every value
        if: ${{ !cancelled() && steps.regression.outcome == 'success' }}
        run: |
          python research/r1a_method_calibration/study.py --output "$RUNNER_TEMP/r1a-method-replay"
          python research/r1a_method_calibration/replay_audit.py \
            --reference docs/ops/evidence/r1a_method_calibration_20260912 \
            --replay "$RUNNER_TEMP/r1a-method-replay" \
            --output "$RUNNER_TEMP/r1a-method-replay-audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-statistical-replay-audits-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r1a-*-replay-audit.json
            ${{ runner.temp }}/r1a-method-replay
            ${{ runner.temp }}/r1a-robustness-replay
            ${{ runner.temp }}/r1a-feasibility-replay
          if-no-files-found: warn
