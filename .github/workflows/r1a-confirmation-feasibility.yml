name: r1a-confirmation-feasibility

on:
  workflow_dispatch:
  push:
    branches: [research/r1a-confirmation-feasibility-v1]
    paths:
      - '.github/workflows/r1a-confirmation-feasibility.yml'

permissions:
  contents: write

concurrency:
  group: r1a-feasibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  feasibility-and-data-role:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research
            tests/test_r1a_confirmation_feasibility.py
            tests/test_r1a_endpoint_robustness.py
            docs/governance
            docs/ops/evidence/r1_incremental_alpha_20260911
            docs/ops/evidence/r1a_endpoint_diagnostic_20260912
            docs/ops/evidence/r1a_endpoint_robustness_20260912
            data/manifest.json
            data/market/1m
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research package
        run: python -m pip install -e .
      - name: Test power, simulation and metadata-only boundaries
        run: python -m pytest -q tests/test_r1a_confirmation_feasibility.py tests/test_r1a_endpoint_robustness.py
      - name: Audit confirmation data roles without candidate prices
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/r1a_confirmation_feasibility/audit_data_roles.py --output docs/ops/evidence/r1a_confirmation_feasibility_20260912/data_role
      - name: Compute fixed power scenarios and null calibration
        run: python research/r1a_confirmation_feasibility/study.py --output docs/ops/evidence/r1a_confirmation_feasibility_20260912/planning
      - name: Preserve feasibility receipts without changing historical studies
        env:
          RESEARCH_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/r1a_confirmation_feasibility_20260912
          if ! git diff --cached --quiet; then
            git commit -m 'research: record conditional power, estimator calibration and data-role audit [skip ci]'
            git push origin "HEAD:$RESEARCH_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-confirmation-feasibility-${{ github.run_id }}
          path: docs/ops/evidence/r1a_confirmation_feasibility_20260912
          if-no-files-found: warn
