name: r1a-development-noise
on:
  workflow_dispatch:
  push:
    branches: [research/r1a-development-noise-v1]
    paths: ['.github/workflows/r1a-development-noise.yml']
permissions:
  contents: write
concurrency:
  group: r1a-dev-noise-${{ github.ref }}
  cancel-in-progress: false
jobs:
  development-noise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            pyproject.toml
            src
            shared
            research/index_price_validity
            research/r1_incremental_alpha_attribution
            research/r1a_development_noise
            tests/test_r1a_development_noise.py
            docs/governance/INDEX_PRICE_VALIDITY_FREEZE@1.0.json
            docs/governance/R1A_DEVELOPMENT_NOISE_DECOMPOSITION_FREEZE@1.0.json
            data/manifest.json
            data/market/1m/000852.SH/2015.parquet
            data/market/1m/000852.SH/2016.parquet
            data/market/1m/000852.SH/2017.parquet
            data/market/1m/000852.SH/2018.parquet
            data/market/1m/000852.SH/2019.parquet
            data/market/1m/000852.SH/2020.parquet
            data/market/1m/000688.SH/2020.parquet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Verify source access and mathematical boundaries
        run: |
          python -m pytest -q tests/test_r1a_development_noise.py
          python - <<'PY'
          from pathlib import Path
          actual={str(p) for p in Path('data').rglob('*.parquet')}
          allowed={f'data/market/1m/000852.SH/{y}.parquet' for y in range(2015,2021)}|{'data/market/1m/000688.SH/2020.parquet'}
          assert actual==allowed,(actual-allowed,allowed-actual)
          assert not Path('data/r1a_carrier_prices').exists()
          assert not Path('docs/ops/evidence/r1_incremental_alpha_20260911/matched_pairs.csv').exists()
          print('Only seven original pre2021 price partitions accessible; no ETF or Validation ledger.')
          PY
      - name: Execute frozen real difference-noise decomposition
        run: python research/r1a_development_noise/study.py --output docs/ops/evidence/r1a_development_noise_20260912
      - name: Retain evidence without touching old ledgers
        if: github.ref == 'refs/heads/research/r1a-development-noise-v1'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse docs/ops/evidence/r1a_development_noise_20260912
          if ! git diff --cached --quiet; then
            git commit -m 'research: retain actual Development noise components and clock audit [skip ci]'
            git push origin HEAD:research/r1a-development-noise-v1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1a-development-noise-${{ github.run_id }}
          path: docs/ops/evidence/r1a_development_noise_20260912
          if-no-files-found: warn
