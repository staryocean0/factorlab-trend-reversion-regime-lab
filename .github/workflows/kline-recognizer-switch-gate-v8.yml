name: kline-recognizer-switch-gate-v8-once

on:
  push:
    branches:
      - research/kline-recognizer-switch-gate-v8
    paths:
      - .github/workflows/kline-recognizer-switch-gate-v8.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/kline-recognizer-switch-gate-v8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Validate immutable market package
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pyarrow.parquet as pq
          root = Path('.').resolve()
          manifest = json.loads((root / 'data/manifest.json').read_text())
          counts = {}
          for item in manifest['files']:
              path = root / item['path']
              with path.open('rb') as handle:
                  actual = hashlib.file_digest(handle, 'sha256').hexdigest()
              assert actual == item['sha256'], item['path']
              pf = pq.ParquetFile(path)
              assert pf.metadata.num_rows == item['rows'], item['path']
              frame = pf.read(columns=['symbol', 'trading_day']).to_pandas()
              assert set(frame['symbol']) == {item['symbol']}, item['path']
              assert frame['trading_day'].min() == item['first_day'], item['path']
              assert frame['trading_day'].max() == item['last_day'], item['path']
              assert item['last_day'] <= '2025-12-31', item['path']
              key = f"{item['symbol']}:{item['frequency']}"
              counts[key] = counts.get(key, 0) + len(frame)
          print(json.dumps({'status':'passed','partitions':len(manifest['files']),'rows':counts}, ensure_ascii=False))
          PY
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run frozen v8 learned switch gate
        run: python scripts/run_kline_switch_gate_v8.py --code-commit "$(git rev-parse HEAD)"
      - name: Commit immutable v8 result bundle
        run: |
          git config user.name "factorlab-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add experiments/kline_recognizer_switch_gate_v8
          git commit -m "[skip ci] record K-line switch gate v8 results" || exit 0
          git push origin HEAD:research/kline-recognizer-switch-gate-v8
