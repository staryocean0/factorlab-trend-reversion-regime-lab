name: etf-source-repair-regression
on:
  workflow_dispatch:
  push:
    branches: [main, audit/etf-source-repair-impact-v1]
    paths:
      - 'research/etf_source_repair/**'
      - 'tests/test_etf_source_repair*.py'
      - 'data/etf_source_actions_v2/**'
      - 'data/r1a_carrier_prices/cloud_pack_v1/**'
      - 'docs/governance/ETF_ACTION_SOURCE_OVERLAY_V2_20260912.json'
      - 'docs/governance/ETF_SOURCE_REPAIR_IMPACT_FREEZE@1.0.json'
      - 'docs/ops/evidence/etf_source_repair_20260912/**'
      - '.github/workflows/etf-source-repair.yml'
      - '.github/workflows/etf-index-measurability.yml'
permissions:
  contents: read
jobs:
  retained-source-impact-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pyproject.toml
            /src/
            /shared/
            /research/
            /scripts/
            /.github/
            /tests/test_etf_source_repair.py
            /tests/test_etf_source_repair_retained.py
            /docs/governance/
            /docs/ops/evidence/r1_incremental_alpha_20260911/matched_pairs.csv
            /docs/ops/evidence/r1a_carrier_transport_20260912_local/
            /docs/ops/evidence/r1a_endpoint_diagnostic_20260912/
            /docs/ops/evidence/r1a_carrier_source_audit_20260912/
            /docs/ops/evidence/etf_index_measurability_20260912/
            /docs/ops/evidence/etf_index_measurability_source_20260912/
            /docs/ops/evidence/etf_source_repair_20260912/
            /data/manifest.json
            /data/etf_source_actions_v2/
            /data/r1a_carrier_prices/cloud_pack_v1/
            /data/market/1m/000852.SH/202[1-5].parquet
            /data/market/1m/000688.SH/202[1-5].parquet
      - name: Fetch baseline tree for historical operational-file verification
        run: git fetch --no-tags --filter=blob:none --depth=1 origin ef18bf905e9e427153650d5538a996249bb6a901
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Test action boundaries and retained impact evidence
        run: python -m pytest -q tests/test_etf_source_repair.py tests/test_etf_source_repair_retained.py
      - name: Verify retained scientific inputs and historical workflow identity
        run: python research/etf_source_repair/verify_retained.py --output "$RUNNER_TEMP/etf-source-impact-regression.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-source-impact-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/etf-source-impact-regression.json
          if-no-files-found: warn
